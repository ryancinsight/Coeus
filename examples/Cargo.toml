[dependencies]
# Workspace dependencies
dtype = { path = "../dtype", features = ["half"] }
storage = { path = "../storage" }
backend = { path = "../backend" }
tensor = { path = "../tensor" }
autograd = { path = "../autograd" }
nn = { path = "../nn", features = ["safetensors"] }
optim = { path = "../optim" }
distributed = { path = "../distributed" }
coeus-semantic-api = { path = "../coeus-semantic-api" }

# Command line argument parsing
clap = { version = "4.0", features = ["derive"] }

# Async runtime for distributed examples
tokio.workspace = true

# Tracing for observability
tracing.workspace = true
tracing-subscriber.workspace = true

# Random number generation for examples
rand = "0.8"

# JSON serialization for examples
serde_json = "1.0"

# HTTP client for dataset downloads
reqwest = { version = "0.11", features = ["json"] }

# Gzip decompression for datasets
flate2 = "1.0"
