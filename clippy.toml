# Clippy configuration for Coeus workspace
# Ensures consistent code quality and style across all crates

# Allow unwrap/expect in tests
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Allow print macros in examples
allow-print-in-tests = true

# Allow missing docs in private items
missing-docs-in-crate-items = false

# Discourage indexing collections
allow-indexing-slicing-in-tests = false

# Performance optimizations
too-many-arguments-threshold = 10
cognitive-complexity-threshold = 25

# Code quality settings
trivial-copy-size-limit = 0
pass-by-value-size-limit = 256

# Enable additional lint groups
warn-on-all-wildcard-imports = true
