[package]
name = "tensor"
description = "Core tensor implementation for Coeus deep learning framework"
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "tensor", "pytorch"]
categories = ["science", "mathematics"]
documentation = "https://docs.rs/coeus-tensor"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["std", "cpu"]
std = ["storage/std"]
gpu = ["backend/gpu"]
cpu = ["backend/cpu"]

[dependencies]
dtype.workspace = true
storage.workspace = true
dense.workspace = true
coeus-sparse.workspace = true
backend.workspace = true
num-traits.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
statrs.workspace = true
rand.workspace = true
rand_distr.workspace = true

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
criterion.workspace = true
pollster.workspace = true

[[test]]
name = "proptest"
path = "tests/proptest.rs"

[[test]]
name = "concurrency"
path = "tests/concurrency.rs"

[[test]]
name = "dispatch_verification"
path = "tests/dispatch_verification.rs"

[[bench]]
name = "conditional_unsafe"
path = "benches/conditional_unsafe.rs"
harness = false
