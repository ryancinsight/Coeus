[package]
name = "coeus-tensor"
description = "Core tensor implementation for Coeus deep learning framework"
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "tensor", "pytorch"]
categories = ["science", "mathematics"]
documentation = "https://docs.rs/coeus-tensor"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["coeus-storage/std"]
gpu = ["coeus-backend/gpu"]

[dependencies]
coeus-dtype = { path = "../dtype" }
coeus-storage = { path = "../storage" }
coeus-backend = { path = "../backend" }
num-traits.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
statrs = "0.4"

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
criterion.workspace = true

[[test]]
name = "proptest"
path = "tests/proptest.rs"
harness = false
pollster = "0.3"

[[test]]
name = "concurrency"
path = "tests/concurrency.rs"

[[bench]]
name = "conditional_unsafe"
path = "tensor/benches/conditional_unsafe/main.rs"
harness = false

