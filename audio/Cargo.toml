[package]
name = "audio"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
authors = ["Ryan Clanton <ryan@coeus.dev>"]
description = "Audio processing primitives for Coeus deep learning framework"
readme = "../README.md"
keywords = ["machine-learning", "deep-learning", "audio", "fft", "signal-processing"]
categories = ["science", "multimedia::audio"]
repository = "https://github.com/ryancinsight/coeus"
homepage = "https://github.com/ryancinsight/coeus"
rust-version = "1.70"

[features]
default = ["std"]
std = []
gpu = ["backend/gpu"]

[dependencies]
rustfft = "6.1"
tensor = { path = "../tensor" }
dtype = { path = "../dtype" }
backend = { path = "../backend", features = ["gpu"] }
storage = { path = "../storage" }
autograd = { path = "../autograd" }
num-complex = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
