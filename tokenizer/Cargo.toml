[package]
name = "tokenizer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Complete tokenization suite for NLP with BPE, WordPiece, and SentencePiece support"
readme = "README.md"
keywords = ["nlp", "tokenization", "bpe", "wordpiece", "sentencepiece", "transformers"]
categories = ["text-processing", "algorithms"]

[dependencies]
# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Unicode processing
unicode-normalization = "0.1"
unicode-segmentation = "1.10"

# Collections
hashbrown = "0.14"

# Regex for preprocessing
regex = "1.10"

# Async support (future-proofing)
tokio = { workspace = true, optional = true }

# Tracing
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
approx.workspace = true
tracing-test.workspace = true

[features]
default = []
async = ["tokio"]
bpe = []
wordpiece = []
sentencepiece = []
all-tokenizers = ["bpe", "wordpiece", "sentencepiece"]

[lib]
name = "coeus_tokenizer"
path = "src/lib.rs"

