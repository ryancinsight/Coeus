[package]
name = "distributed"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Distributed training support for Coeus deep learning framework"
readme = "README.md"
keywords = ["deep-learning", "distributed", "data-parallelism", "pytorch"]
categories = ["science", "algorithms"]

[dependencies]
# Workspace dependencies
tensor = { path = "../tensor" }
nn = { path = "../nn" }
backend = { path = "../backend" }
storage = { path = "../storage" }
dtype = { path = "../dtype" }
optim = { path = "../optim" }
# coeus-autograd = { path = "../autograd" }  # Temporarily disabled for NN decoupling testing

# Async runtime for distributed operations
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# GPU compute for distributed operations
wgpu = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Safe casting between byte arrays
bytemuck = { workspace = true }

# Binary serialization for distributed communication
bincode = "1.3"

[dev-dependencies]
# For testing async code
futures = "0.3"

# Safe casting
bytemuck = { workspace = true }
