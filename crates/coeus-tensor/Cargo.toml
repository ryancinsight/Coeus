[package]
name = "coeus-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords = ["tensor", "strided", "views", "copy-on-write", "checkpoint"]
description = "Strided tensor type with copy-on-write storage, layout views, and checkpointing for Coeus."
[lib]
path = "src/lib.rs"

[dependencies]
coeus-core  = { workspace = true }
coeus-leto  = { version = "0.10.0", path = "../coeus-leto" }
smallvec    = { workspace = true }
thiserror   = { workspace = true }
bytemuck    = { workspace = true }
rkyv        = { workspace = true }


[dev-dependencies]
criterion = { workspace = true }
coeus-ops = { path = "../coeus-ops" }
coeus-nn = { path = "../coeus-nn" }
coeus-autograd = { path = "../coeus-autograd", default-features = false }
leto = { workspace = true }
leto-ops = { workspace = true }
bincode = { version = "=2.0.0-rc.3", features = ["serde"] }
proptest  = "1.5"
mnemosyne = { workspace = true }


[[bench]]
name = "tensor_bench"
harness = false
