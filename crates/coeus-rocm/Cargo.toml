[package]
name = "coeus-rocm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories = ["science", "hardware-support", "mathematics"]
keywords = ["rocm", "amd", "gpu", "hip", "accelerator"]
description = "ROCm backend integration for Coeus through Hephaestus."

[features]
default = []
rocm = ["hephaestus-rocm/rocm"]

[dependencies]
coeus-core = { workspace = true }
coeus-accelerator = { version = "0.12.0", path = "../coeus-accelerator" }
coeus-ops = { workspace = true, default-features = false }
hephaestus-core = { workspace = true }
hephaestus-rocm = { workspace = true }
leto-ops = { workspace = true }

[dev-dependencies]
coeus-cpu = { version = "0.12.0", path = "../coeus-cpu" }
coeus-tensor = { workspace = true }
coeus-nn = { version = "0.12.0", path = "../coeus-nn", default-features = false }
tracing = { workspace = true }

[lints]
workspace = true
