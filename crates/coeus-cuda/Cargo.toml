[package]
name = "coeus-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories = ["science", "hardware-support", "mathematics"]
keywords = ["cuda", "gpu", "nvidia", "kernels", "accelerator"]
description = "CUDA backend integration for Coeus tensor operations."

[dependencies]
coeus-core   = { workspace = true }
coeus-tensor = { workspace = true }
coeus-ops    = { workspace = true, default-features = false }
coeus-hephaestus = { workspace = true }
leto         = { workspace = true }
leto-ops     = { workspace = true }
bytemuck     = { workspace = true }
thiserror    = { workspace = true }
eunomia     = { workspace = true }
hephaestus-cuda = { workspace = true }
hephaestus-core = { workspace = true }
themis = { workspace = true, optional = true }

[features]
cuda = ["dep:themis", "hephaestus-cuda/cuda"]

[dev-dependencies]
coeus-autograd = { path = "../coeus-autograd", default-features = false }
coeus-nn = { path = "../coeus-nn", default-features = false }
criterion = "0.5"

[[bench]]
name = "ops_bench"
harness = false
required-features = ["cuda"]

[[bench]]
name = "attention_bench"
harness = false
required-features = ["cuda"]
