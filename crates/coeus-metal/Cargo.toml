[package]
name = "coeus-metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories = ["science", "hardware-support", "mathematics"]
keywords = ["metal", "apple", "gpu", "accelerator", "macos"]
description = "Metal backend integration for Coeus through Hephaestus."

[dependencies]
coeus-core = { workspace = true }
coeus-hephaestus = { version = "0.10.0", path = "../coeus-hephaestus" }
coeus-ops = { workspace = true, default-features = false }
hephaestus-core = { workspace = true }
hephaestus-metal = { workspace = true }
leto-ops = { workspace = true }

[dev-dependencies]
coeus-leto = { version = "0.10.0", path = "../coeus-leto" }
coeus-tensor = { workspace = true }
coeus-nn = { version = "0.10.0", path = "../coeus-nn", default-features = false }
