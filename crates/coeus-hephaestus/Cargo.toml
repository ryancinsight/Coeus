[package]
name = "coeus-hephaestus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories = ["science", "hardware-support", "mathematics"]
keywords = ["gpu", "accelerator", "device", "backend", "hephaestus"]
description = "Generic Coeus integration layer for Hephaestus device providers."

[dependencies]
coeus-core = { workspace = true }
coeus-ops = { workspace = true, default-features = false }
hephaestus-core = { workspace = true }
leto = { workspace = true }
leto-ops = { workspace = true }
bytemuck = { workspace = true }
# Eunomia owns the datatype law the provider's buffer contract is stated in
# (`ComputeDevice::Buffer<T: Pod>`); bytemuck above remains for the byte-cast
# helpers the test doubles use.
eunomia = { workspace = true }
themis = { workspace = true }
thiserror = { workspace = true }
