[package]
name = "coeus-sparse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Sparse tensor operations for Coeus."

[dependencies]
coeus-core   = { workspace = true }
coeus-tensor = { workspace = true }
thiserror    = { workspace = true }
smallvec     = { workspace = true }

[dev-dependencies]
# Dev-only: exercise the sparse ops (which live in coeus-ops, itself a consumer
# of coeus-sparse) against a dense matmul oracle. A dev-dependency cycle, which
# Cargo permits since it does not affect the normal build graph.
coeus-ops = { path = "../coeus-ops", default-features = false }
