[package]
name = "coeus-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories = ["science", "hardware-support", "mathematics"]
keywords = ["wgpu", "webgpu", "gpu", "wgsl", "compute-shader"]
description = "WebGPU backend integration for Coeus tensor operations."

[dependencies]
coeus-core   = { workspace = true }
coeus-tensor = { workspace = true }
coeus-ops    = { workspace = true, default-features = false }
coeus-hephaestus = { workspace = true }
hephaestus-wgpu = { workspace = true }
hephaestus-core = { workspace = true }
wgpu         = { workspace = true }
bytemuck     = { workspace = true }
thiserror    = { workspace = true }
half         = { workspace = true }
leto-ops     = { workspace = true }
leto         = { workspace = true }
themis       = { workspace = true }

[dev-dependencies]
coeus-autograd = { path = "../coeus-autograd", default-features = false }
coeus-nn       = { path = "../coeus-nn", default-features = false }
criterion      = "0.5"

[[bench]]
name = "attention_bench"
harness = false

[[bench]]
name = "ops_bench"
harness = false

[lints]
workspace = true
