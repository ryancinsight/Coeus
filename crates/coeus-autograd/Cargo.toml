[package]
name = "coeus-autograd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords = ["autodiff", "autograd", "gradients", "tensor", "deep-learning"]
description = "Automatic differentiation primitives for the Coeus tensor stack."

[features]
physical-units = ["dep:aequitas", "dep:eunomia"]

[dependencies]
aequitas = { version = "0.5.0", default-features = false, optional = true }
eunomia = { workspace = true, optional = true }
coeus-core   = { workspace = true }
coeus-tensor = { workspace = true }
coeus-ops    = { workspace = true, default-features = false }
coeus-sparse = { workspace = true }
apollo-fft   = { workspace = true }
leto-ops     = { workspace = true }
mnemosyne    = { workspace = true }
smallvec     = { workspace = true }
thiserror    = { workspace = true }

[dev-dependencies]
eunomia = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
coeus-nn = { path = "../coeus-nn", default-features = false }
coeus-cpu = { version = "0.14.0", path = "../coeus-cpu" }

[lints]
workspace = true
