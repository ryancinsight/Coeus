apiVersion: apps/v1
kind: Deployment
metadata:
  name: coeus-deployment
  namespace: ml-platform
  labels:
    app: coeus
    component: deep-learning-framework
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: coeus
      component: deep-learning-framework
  template:
    metadata:
      labels:
        app: coeus
        component: deep-learning-framework
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: coeus-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: coeus-main
        image: ${ECR_REGISTRY}/coeus:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        - name: MODEL_PATH
          value: "/app/models"
        - name: LOG_PATH
          value: "/app/logs"
        - name: ENTERPRISE_MODE
          value: "true"
        - name: MONITORING_ENABLED
          value: "true"
        - name: SECURITY_AUDIT
          value: "true"
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1,2,3"
        resources:
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "4"
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
        - name: log-storage
          mountPath: /app/logs
        - name: config-storage
          mountPath: /app/config
        - name: secrets-storage
          mountPath: /app/secrets
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      - name: monitoring-sidecar
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
          name: prometheus
        volumeMounts:
        - name: monitoring-config
          mountPath: /etc/prometheus/
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "100m"
            memory: "256Mi"
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: coeus-model-pvc
      - name: log-storage
        persistentVolumeClaim:
          claimName: coeus-log-pvc
      - name: config-storage
        configMap:
          name: coeus-config
      - name: secrets-storage
        secret:
          secretName: coeus-secrets
      - name: monitoring-config
        configMap:
          name: prometheus-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: accelerator
                operator: In
                values:
                - nvidia-tesla-v100
                - nvidia-tesla-a100
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: coeus
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: coeus-service
  namespace: ml-platform
  labels:
    app: coeus
    component: deep-learning-framework
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: coeus
    component: deep-learning-framework

---
apiVersion: v1
kind: Service
metadata:
  name: coeus-loadbalancer
  namespace: ml-platform
  labels:
    app: coeus
    component: deep-learning-framework
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: coeus
    component: deep-learning-framework

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coeus-ingress
  namespace: ml-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - ml-api.coeus-framework.com
    secretName: coeus-tls
  rules:
  - host: ml-api.coeus-framework.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: coeus-service
            port:
              number: 8080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coeus-config
  namespace: ml-platform
data:
  config.yaml: |
    enterprise:
      mode: true
      monitoring: true
      security_audit: true
    model:
      cache_size: 10GB
      preload_models: true
    gpu:
      memory_fraction: 0.8
      allow_growth: true
    logging:
      level: INFO
      format: json
      outputs:
        - stdout
        - file:/app/logs/coeus.log

---
apiVersion: v1
kind: Secret
metadata:
  name: coeus-secrets
  namespace: ml-platform
type: Opaque
data:
  # Base64 encoded secrets
  api_key: <BASE64_ENCODED_API_KEY>
  database_url: <BASE64_ENCODED_DB_URL>
  model_registry_token: <BASE64_ENCODED_TOKEN>

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coeus-model-pvc
  namespace: ml-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coeus-log-pvc
  namespace: ml-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coeus-service-account
  namespace: ml-platform
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coeus-cluster-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coeus-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coeus-cluster-role
subjects:
- kind: ServiceAccount
  name: coeus-service-account
  namespace: ml-platform

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coeus-pdb
  namespace: ml-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: coeus
      component: deep-learning-framework

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coeus-service-monitor
  namespace: ml-platform
  labels:
    team: ml-platform
spec:
  selector:
    matchLabels:
      app: coeus
      component: deep-learning-framework
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ml-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      - job_name: 'coeus'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: '/metrics'
        scrape_interval: 5s
