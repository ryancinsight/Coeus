[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pycoeus"
version = "0.1.0"
description = "PyTorch-compatible neural network library built in Rust"
authors = [
    {name = "Coeus Team", email = "team@coeus.ai"},
]
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
keywords = ["machine-learning", "neural-networks", "pytorch", "rust", "tensor", "autograd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "torch>=1.12.0",  # For comparison tests
    "torchvision>=0.13.0",  # For comparison tests
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
    "psutil>=5.8.0",
    "torch>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/coeus-ai/coeus"
Repository = "https://github.com/coeus-ai/coeus"
Documentation = "https://coeus.readthedocs.io"
"Bug Tracker" = "https://github.com/coeus-ai/coeus/issues"

[tool.maturin]
python-source = "python"
module-name = "pycoeus._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as requiring GPU",
    "comparison: marks tests that compare with PyTorch",
    "api: marks tests for API compatibility",
    "autograd: marks tests for automatic differentiation",
    "broadcasting: marks tests for tensor broadcasting",
    "dtype: marks tests for data type compatibility",
    "edge_case: marks tests for edge cases",
    "memory: marks tests for memory management",
    "numerical: marks tests for numerical accuracy",
    "performance: marks tests for performance benchmarking",
    "pytorch_compat: marks tests for PyTorch compatibility",
    "statistical: marks tests for statistical analysis",
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py38"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]