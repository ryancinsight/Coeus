[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "coeus"
version = "1.0.0"
description = "Safe PyTorch in Rust - Python bindings"
readme = "../README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "Ryan Clanton", email = "ryan@coeus.dev"},
]
maintainers = [
    {name = "Ryan Clanton", email = "ryan@coeus.dev"},
]
keywords = ["pytorch", "deep-learning", "machine-learning", "rust", "neural-networks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/ryancinsight/coeus"
Repository = "https://github.com/ryancinsight/coeus"
Documentation = "https://docs.rs/coeus"
"Bug Reports" = "https://github.com/ryancinsight/coeus/issues"
"Source" = "https://github.com/ryancinsight/coeus"

[tool.maturin]
python-source = "python"
module-name = "coeus._coeus"
features = ["pyo3/extension-module"]
include = [
    {path = "../README.md", format = "sdist"},
    {path = "../docs/*.md", format = "sdist"},
]
