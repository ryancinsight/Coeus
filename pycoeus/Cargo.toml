[package]
name = "pycoeus"
version = "0.1.0"
edition = "2021"
authors = ["Coeus Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/coeus"
description = "Python bindings for Coeus tensor library with PyTorch-compatible API"

[lints.clippy]
useless_conversion = "allow"

[lib]
name = "pycoeus"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "macros", "auto-initialize"] }
numpy = "0.24"
coeus-tensor = { path = "../tensor" }
coeus-backend = { path = "../backend" }
coeus-dtype = { path = "../dtype" }
coeus-nn = { path = "../nn" }
coeus-optim = { path = "../optim" }
coeus-utils = { path = "../utils" }
coeus-fft = { path = "../fft" }
coeus-hub = { path = "../hub" }
coeus-tokenizer = { path = "../tokenizer" }
num-traits = "0.2"
thiserror = "1.0"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
approx = "0.5"

[features]
default = []
cpu = []
gpu = []
