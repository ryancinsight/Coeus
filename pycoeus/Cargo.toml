[package]
name = "pycoeus"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ryan Clanton <ryan@coeus.dev>"]
repository = "https://github.com/ryancinsight/coeus"
homepage = "https://github.com/ryancinsight/coeus"
rust-version = "1.70"
description = "Python bindings for Coeus deep learning framework"
readme = "../README.md"
keywords = ["python", "machine-learning", "deep-learning", "pytorch", "bindings"]
categories = ["api-bindings", "science"]

[lib]
name = "pycoeus"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = ">=0.24.1", features = ["extension-module", "abi3-py312"] }
numpy = ">=0.26"
coeus-tensor = { path = "../tensor" }
coeus-dtype = { path = "../dtype" }
coeus-backend = { path = "../backend" }
coeus-storage = { path = "../storage" }
coeus-autograd = { path = "../autograd" }
coeus-nn = { path = "../nn", features = ["autograd", "dropout"] }
coeus-optim = { path = "../optim" }
coeus-utils = { path = "../utils" }  # ENABLED - PyO3 advanced features depend on this
coeus-tokenizer = { path = "../tokenizer", features = ["all-tokenizers"] }
num-traits = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
rand_distr = "0.4"
