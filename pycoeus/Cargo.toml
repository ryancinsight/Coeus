[package]
name = "pycoeus"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
authors = ["Ryan Clanton <ryan@coeus.dev>"]
repository = "https://github.com/ryancinsight/coeus"
homepage = "https://github.com/ryancinsight/coeus"
rust-version = "1.70"
description = "Python bindings for Coeus deep learning framework"
readme = "../README.md"
keywords = ["python", "machine-learning", "deep-learning", "pytorch", "bindings"]
categories = ["api-bindings", "science"]

[lib]
name = "pycoeus"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = ">=0.24.1", features = ["extension-module", "abi3-py312"] }
numpy = ">=0.26"
tensor = { path = "../tensor" }
dtype = { path = "../dtype" }
backend = { path = "../backend" }
storage = { path = "../storage" }
autograd = { path = "../autograd" }
nn = { path = "../nn", features = ["autograd", "dropout"] }
optim = { path = "../optim" }
utils = { path = "../utils" }
coeus-linalg = { path = "../linalg" }
coeus-signal = { path = "../signal" }
coeus-special = { path = "../special" }
tokenizer = { path = "../tokenizer", features = ["all-tokenizers"] }
coeus-fft = { path = "../fft" }
coeus-sparse = { workspace = true, features = ["gpu"] }
vision = { package = "coeus-vision", path = "../vision" }
num-traits = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
rand_distr = "0.4"

# FFT support
# audio = { path = "../audio" }
