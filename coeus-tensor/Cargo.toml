[package]
name = "coeus-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
[lib]
path = "src/lib.rs"

[dependencies]
coeus-core  = { workspace = true }
coeus-leto  = { path = "../coeus-leto" }
smallvec    = { workspace = true }
thiserror   = { workspace = true }
bytemuck    = { workspace = true }
rkyv        = { workspace = true }


[dev-dependencies]
criterion = "0.5"
coeus-ops = { workspace = true }
coeus-nn = { path = "../coeus-nn" }
coeus-autograd = { workspace = true, default-features = false }
leto = { workspace = true }
leto-ops = { workspace = true }
bincode = { version = "=2.0.0-rc.3", features = ["serde"] }
proptest  = "1.5"
mnemosyne = { workspace = true }
# Burn NdArray backend — dev/bench only (production policy enforced by dependency_policy test).
burn = { version = "0.16", features = ["ndarray"], default-features = false }


[[bench]]
name = "tensor_bench"
harness = false
