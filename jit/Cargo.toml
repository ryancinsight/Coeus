[package]
name = "jit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "JIT compilation and graph optimization for Coeus deep learning framework"
readme = "README.md"
keywords = ["deep-learning", "jit", "compiler", "optimization"]
categories = ["science", "algorithms", "compilers"]

[dependencies]
# Workspace dependencies
coeus-tensor = { path = "../tensor" }
coeus-autograd = { path = "../autograd" }
coeus-backend = { path = "../backend" }
coeus-storage = { path = "../storage" }
coeus-nn = { path = "../nn" }
coeus-dtype = { path = "../dtype" }

# Error handling
thiserror = { workspace = true }

# Collections and utilities
indexmap = "2.0"

# Logging
tracing = { workspace = true }

[dev-dependencies]
# Temporary files for testing
tempfile = "3.0"
