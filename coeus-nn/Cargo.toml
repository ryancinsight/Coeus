[package]
name = "coeus-nn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
coeus-core     = { workspace = true }
coeus-tensor   = { workspace = true }
coeus-autograd = { workspace = true, default-features = false }
coeus-ops      = { workspace = true, default-features = false }
coeus-leto     = { path = "../coeus-leto" }
smallvec       = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
coeus-autograd = { workspace = true, default-features = false }
coeus-ops      = { workspace = true, default-features = false }
coeus-optim    = { path = "../coeus-optim" }
criterion      = "0.5"
# Burn remains confined to external Criterion baselines; NN correctness tests
# use native analytical and provider-conformance contracts.
burn           = { version = "0.16", features = ["ndarray", "autodiff"], default-features = false }

[[bench]]
name = "nn_bench"
path = "benches/nn_bench.rs"
harness = false


