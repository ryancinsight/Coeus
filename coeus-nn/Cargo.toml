[package]
name = "coeus-nn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
coeus-core     = { workspace = true }
coeus-tensor   = { workspace = true }
coeus-autograd = { workspace = true, default-features = false }
coeus-ops      = { workspace = true, default-features = false }
coeus-leto     = { path = "../coeus-leto" }
smallvec       = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
coeus-autograd = { workspace = true, default-features = false }
coeus-ops      = { workspace = true, default-features = false }
coeus-optim    = { path = "../coeus-optim" }
# Burn NdArray backend — dev/bench only (production policy enforced by dependency_policy test).
# `autodiff` enables Autodiff<NdArray> for gradient comparison tests.
burn           = { version = "0.16", features = ["ndarray", "autodiff"], default-features = false }

[[test]]
name = "burn_live_parity"
path = "tests/burn_live_parity.rs"


