[package]
name = "coeus-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "pycoeus"
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
coeus-core     = { workspace = true }
coeus-tensor   = { workspace = true }
coeus-ops      = { workspace = true, default-features = false }
coeus-autograd = { workspace = true, default-features = false }
coeus-fft      = { workspace = true }
coeus-nn       = { workspace = true, default-features = false }
coeus-optim    = { workspace = true, default-features = false }
coeus-dist     = { workspace = true, default-features = false }
moirai         = { workspace = true }
pyo3           = { workspace = true }
smallvec       = { workspace = true }
half           = { workspace = true }
# Allocation SSOT — registered as the global allocator (see lib.rs). Optional so
# `--no-default-features` cleanly drops it (system allocator for sanitizers/profiling).
mnemosyne      = { workspace = true, optional = true }

[features]
default = ["mnemosyne-global"]
# Route the extension's Rust allocations through the Mnemosyne global allocator.
mnemosyne-global = ["dep:mnemosyne"]
