[package]
name = "coeus-distributions"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@protomail.com>"]
description = "Probability distributions and sampling utilities for Coeus"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/Coeus"
readme = "../README.md"
keywords = ["probability", "distributions", "sampling"]
