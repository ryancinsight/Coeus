# mdBook configuration for the coeus tensor book.
[book]
title = "coeus: Tensors, Autodiff, and NN for Atlas"
authors = ["Ryan Clanton"]
description = "N-dimensional tensors, automatic differentiation, neural networks, and optimizer steps for the Atlas simulation stack."
src = "."
language = "en"

[build]
build-dir = "../../target/book/coeus"
create-missing = false

[output.html]
no-section-label = false
mathjax-support = true
site-url = "/coeus/"
git-repository-url = "https://github.com/ryancinsight/coeus"
edit-url-template = "https://github.com/ryancinsight/coeus/edit/main/docs/book/{path}"
default-theme = "rust"
