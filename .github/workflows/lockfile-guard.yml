name: Lockfile integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says. Same pattern as
  # ci.yml and backend-parity.yml: a superseded run held no more than a
  # queue slot in the account's shared runner pool.
  group: coeus-lockfile-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read
