name: Backend parity

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      run_rocm_hardware:
        description: Run the ROCm Coeus contracts on the registered AMD runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.97.0

jobs:
  wgpu:
    name: WGPU Coeus provider contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Coeus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coeus
          persist-credentials: false

      - name: Check out Apollo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/apollo
          path: apollo
          persist-credentials: false

      - name: Check out Aequitas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/aequitas
          path: aequitas
          persist-credentials: false

      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hephaestus
          path: hephaestus
          persist-credentials: false

      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          path: hermes
          persist-credentials: false

      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false

      - name: Check out Melinoe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/melinoe
          path: melinoe
          persist-credentials: false

      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false

      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false

      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false

      - name: Check out Themis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/themis
          path: themis
          persist-credentials: false

      - name: Install Vulkan software support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Install the pinned Rust toolchain and nextest
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install nextest
        shell: bash
        run: cargo install cargo-nextest --locked

      - name: Run WGPU and CPU provider contracts
        working-directory: coeus
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" fmt --all --check
          cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-leto --all-targets
          cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-leto --all-targets --no-deps -- -D warnings
          cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-leto
          cargo "+$RUST_TOOLCHAIN" test --locked --package coeus-leto --doc
          cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-ops --all-targets
          cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-ops --all-targets --no-deps -- -D warnings
          cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-ops
          cargo "+$RUST_TOOLCHAIN" test --locked --package coeus-ops --doc
          cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-wgpu --all-targets
          cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-wgpu --all-targets --no-deps -- -D warnings
          cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-wgpu \
            -E "test(cumulative_scans_match_cpu_on_rank_two_device_tensors) or test(product_axis_matches_cpu_on_rank_two_device_tensors) or test(test_wgpu_conv) or test(test_wgpu_conv_backward) or test(test_wgpu_conv3d) or test(test_wgpu_conv3d_stride_padding_dilation_matches_cpu) or test(test_wgpu_conv3d_backward) or test(test_wgpu_conv3d_backward_stride_padding_dilation_matches_cpu) or test(test_wgpu_conv_transpose1d) or test(test_wgpu_conv_transpose2d) or test(test_wgpu_conv_transpose1d_backward_matches_cpu_autograd) or test(test_wgpu_conv_transpose2d_backward_matches_cpu_autograd) or test(test_wgpu_parity_conv1d_forward) or test(test_wgpu_parity_conv2d_forward) or test(test_wgpu_parity_sum_axis0) or test(test_wgpu_parity_sum_axis1) or test(test_wgpu_parity_mean_axis) or test(test_wgpu_parity_max_axis) or test(test_wgpu_parity_min_axis) or test(test_wgpu_parity_prod_axis) or test(test_wgpu_parity_rank_one_sum) or test(test_wgpu_parity_rank_one_scan) or test(test_wgpu_reduction_rejects_unsupported_rank) or test(test_wgpu_parity_add) or test(test_wgpu_hephaestus_contiguous_unary_reuses_output_buffer) or test(test_wgpu_elu_parity) or test(test_wgpu_parity_elu) or test(test_wgpu_strided_elu_transposed_matches_cpu) or test(test_wgpu_strided_elu_gradient_transposed_matches_cpu) or test(test_wgpu_aliasing_elu_rejects_provider_bypass) or test(test_wgpu_parity_gelu_tanh) or test(test_wgpu_parity_softplus)"
          cargo "+$RUST_TOOLCHAIN" test --locked --package coeus-wgpu --doc
          cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-cuda --no-default-features --all-targets
          cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-cuda --no-default-features --all-targets --no-deps -- -D warnings
          cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-cuda --no-default-features
          cargo "+$RUST_TOOLCHAIN" test --locked --package coeus-cuda --no-default-features --doc

  cuda:
    name: CUDA Coeus provider contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_IMAGE: nvidia/cuda:13.2.1-devel-ubuntu24.04
    steps:
      - name: Check out Coeus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coeus
          persist-credentials: false

      - name: Check out Apollo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/apollo
          path: apollo
          persist-credentials: false

      - name: Check out Aequitas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/aequitas
          path: aequitas
          persist-credentials: false

      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hephaestus
          path: hephaestus
          persist-credentials: false

      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          path: hermes
          persist-credentials: false

      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false

      - name: Check out Melinoe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/melinoe
          path: melinoe
          persist-credentials: false

      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false

      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false

      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false

      - name: Check out Themis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/themis
          path: themis
          persist-credentials: false

      - name: Build and test in the NVIDIA CUDA development image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$CUDA_IMAGE"
          docker run --rm --network host \
            --env "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" \
            --env CUDA_TOOLKIT_PATH=/usr/local/cuda \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/coeus \
            "$CUDA_IMAGE" \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends ca-certificates curl git build-essential pkg-config libclang-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              . "$HOME/.cargo/env"
              rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
              rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
              rustup toolchain install stable --profile minimal
              cargo +stable install cargo-nextest --locked
              if [ -f /usr/local/cuda/lib64/stubs/libcuda.so ] && [ ! -e /usr/local/cuda/lib64/stubs/libcuda.so.1 ]; then
                ln -s libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
              fi
              export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:/usr/local/cuda/compat:/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}
              cargo "+$RUST_TOOLCHAIN" fmt --all --check
              cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-ops --all-targets
              cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-ops --all-targets --no-deps -- -D warnings
              cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-ops
              cargo "+$RUST_TOOLCHAIN" test --locked --package coeus-ops --doc
              cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-cuda --features cuda --all-targets
              cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-cuda --features cuda --all-targets --no-deps -- -D warnings
              cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-cuda --features cuda \
                -E "test(matmul_rejects_each_layout_that_exceeds_storage) or test(matmul_rejects_writable_zero_stride_output) or test(cuda_storage_validation_checks_physical_bound_and_writable_aliasing) or test(signed_ptx_storage_validation_enforces_address_boundary) or test(signed_ptx_storage_validation_rejects_oversized_shape_and_stride) or test(pool_storage_validation_rejects_undersized_and_overflowed_layouts) or test(pool_signed_index_validation_covers_forward_and_backward_extrema) or test(test_cuda_backend_conv_and_reduce) or test(test_cuda_conv_backward) or test(test_cuda_conv3d) or test(test_cuda_parity_conv1d_forward) or test(test_cuda_parity_conv2d_forward) or test(test_cuda_parity_conv2d_backward) or test(test_cuda_parity_conv3d_forward) or test(test_cuda_parity_conv3d_backward) or test(test_cuda_parity_conv_transpose1d) or test(test_cuda_parity_conv_transpose2d) or test(test_cuda_parity_conv_transpose1d_backward) or test(test_cuda_parity_conv_transpose2d_backward) or test(test_cuda_parity_sum_axis0) or test(test_cuda_parity_sum_axis1) or test(test_cuda_parity_mean_axis) or test(test_cuda_parity_max_axis) or test(test_cuda_parity_min_axis) or test(test_cuda_parity_prod_axis) or test(test_cuda_parity_rank_one_sum) or test(test_cuda_parity_rank_one_scan) or test(test_cuda_reduction_rejects_unsupported_rank) or test(test_cuda_parity_cumulative_scans) or test(test_cuda_backend_ops) or test(test_cuda_parity_elu) or test(test_cuda_parity_elu_grad) or test(test_cuda_strided_elu_matches_cpu) or test(test_cuda_strided_elu_gradient_matches_cpu) or test(test_cuda_parity_gelu) or test(test_cuda_parity_gelu_grad) or test(test_cuda_parity_gelu_tanh) or test(test_cuda_parity_gelu_tanh_grad) or test(test_cuda_parity_softplus) or test(test_cuda_parity_softplus_grad)"
              cargo "+$RUST_TOOLCHAIN" test --locked --package coeus-cuda --features cuda --doc
            '

  rocm:
    name: ROCm Coeus provider contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ROCM_IMAGE: rocm/dev-ubuntu-24.04:7.2.4
    steps:
      - name: Check out Coeus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coeus
          persist-credentials: false

      - name: Check out Apollo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/apollo
          path: apollo
          persist-credentials: false

      - name: Check out Aequitas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/aequitas
          path: aequitas
          persist-credentials: false

      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hephaestus
          path: hephaestus
          persist-credentials: false

      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          path: hermes
          persist-credentials: false

      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false

      - name: Check out Melinoe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/melinoe
          path: melinoe
          persist-credentials: false

      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false

      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false

      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false

      - name: Check out Themis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/themis
          path: themis
          persist-credentials: false

      - name: Build and test in the AMD ROCm development image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ROCM_IMAGE"
          docker run --rm --network host \
            --env "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/coeus \
            "$ROCM_IMAGE" \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends ca-certificates curl git build-essential pkg-config rocm-hip-runtime-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              . "$HOME/.cargo/env"
              rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
              rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
              rustup toolchain install stable --profile minimal
              cargo +stable install cargo-nextest --locked
              cargo "+$RUST_TOOLCHAIN" fmt --all --check
              cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-hephaestus --all-targets
              cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-hephaestus --all-targets --no-deps -- -D warnings
              cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-rocm --features rocm --all-targets
              cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-rocm --features rocm --all-targets --no-deps -- -D warnings
              cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-rocm --features rocm \
                -E "test(native_reductions_and_scans_match_leto) or test(native_elementwise_operations_match_leto_with_broadcasting)"
              cargo "+$RUST_TOOLCHAIN" test --locked --package coeus-rocm --features rocm --doc
            '

  metal:
    name: Metal Coeus provider contracts
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out Coeus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coeus
          persist-credentials: false

      - name: Check out Apollo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/apollo
          path: apollo
          persist-credentials: false

      - name: Check out Aequitas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/aequitas
          path: aequitas
          persist-credentials: false

      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hephaestus
          path: hephaestus
          persist-credentials: false

      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          path: hermes
          persist-credentials: false

      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false

      - name: Check out Melinoe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/melinoe
          path: melinoe
          persist-credentials: false

      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false

      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false

      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false

      - name: Check out Themis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/themis
          path: themis
          persist-credentials: false

      - name: Install the pinned Rust toolchain and nextest
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install nextest
        shell: bash
        run: cargo install cargo-nextest --locked

      - name: Run Metal and Leto provider contracts
        working-directory: coeus
        env:
          HEPHAESTUS_METAL_REQUIRE_DEVICE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" fmt --all --check
          cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-hephaestus --all-targets
          cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-hephaestus --all-targets --no-deps -- -D warnings
          cargo "+$RUST_TOOLCHAIN" check --locked --package coeus-metal --all-targets
          cargo "+$RUST_TOOLCHAIN" clippy --locked --package coeus-metal --all-targets --no-deps -- -D warnings
          cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-metal \
            -E "test(native_reductions_and_scans_match_leto) or test(native_elementwise_operations_match_leto_with_broadcasting)"
          cargo "+$RUST_TOOLCHAIN" test --locked --package coeus-metal --doc

  rocm-hardware:
    name: ROCm Coeus required-device contracts
    if: github.event_name == 'workflow_dispatch' && inputs.run_rocm_hardware
    runs-on: [self-hosted, linux, x64, rocm]
    timeout-minutes: 30
    steps:
      - name: Check out Coeus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coeus
          persist-credentials: false
      - name: Check out Apollo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/apollo
          path: apollo
          persist-credentials: false
      - name: Check out Hephaestus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hephaestus
          path: hephaestus
          persist-credentials: false
      - name: Check out Leto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/leto
          path: leto
          persist-credentials: false
      - name: Check out Melinoe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/melinoe
          path: melinoe
          persist-credentials: false
      - name: Check out Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/hermes
          path: hermes
          persist-credentials: false
      - name: Check out Eunomia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/eunomia
          path: eunomia
          persist-credentials: false
      - name: Check out Aequitas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/aequitas
          path: aequitas
          persist-credentials: false
      - name: Check out Themis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/themis
          path: themis
          persist-credentials: false
      - name: Check out Mnemosyne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Mnemosyne
          path: mnemosyne
          persist-credentials: false
      - name: Check out Moirai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/Moirai
          path: moirai
          persist-credentials: false
      - name: Install the pinned Rust toolchain and nextest
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install nextest
        shell: bash
        run: cargo install cargo-nextest --locked
      - name: Run required-device ROCm provider contracts
        working-directory: coeus
        env:
          HEPHAESTUS_ROCM_REQUIRE_DEVICE: "1"
        run: cargo "+$RUST_TOOLCHAIN" nextest run --locked --package coeus-rocm --features rocm \
          -E "test(native_reductions_and_scans_match_leto) or test(native_elementwise_operations_match_leto_with_broadcasting)"
