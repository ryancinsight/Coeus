name: CI

# Device-specific contracts run in backend-parity.yml. Native tests and
# documentation compile in separate jobs to retain their existing cache and
# time budgets. Pull requests restore caches; only main updates them.
#
# The native suite runs as three nextest --partition shards over the shared
# sccache backend (see the `tests` job): each shard compiles with mostly
# hits on a warm cache and the partition only divides seconds of execution
# plus per-shard setup. The `test` aggregator preserves the required "Tests"
# check name. Same shape as CFDrs PR 526.
#
# `changed_scope` also selects `skip` for changes that cannot affect a Rust
# build (Markdown/license paths only -- see `scripts/ci_scope.py`): nothing
# under `crates/` or the build/toolchain manifests reads them, so a diff
# entirely inside that set pays no native or doctest compile at all.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: coeus-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # `rust-toolchain.toml` pins 1.97.0, so every cargo call here uses it whatever
  # the action installs. Without this the action defaults to `stable` -- its own
  # log line reads `toolchain: stable` -- and rustup then fetches 1.97.0 as a
  # second toolchain on first use, with the action's `components:` having been
  # installed for the one that does not run. Same value and same mechanism as
  # backend-parity.yml.
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # Public-surface compatibility, informational on pull requests: the
  # detected change class is visible while the change is still in
  # review. The blocking comparison runs on release.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@50802ef4c975bdb1e668b94a700d8310f0348e9c
    with:
      package: coeus-autograd,coeus-core,coeus-dist,coeus-fft,coeus-hephaestus,coeus-leto,coeus-metal,coeus-nn,coeus-ops,coeus-optim,coeus-rocm,coeus-sparse,coeus-tensor,coeus-wgpu
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  adr-index:
    name: ADR index is current
    # atlas owns the one generator (ATLAS-ADR-FORM-NORMALIZATION-2026-09-02); strict: the ADRs carry the canonical heading form and numbering.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@191617bffed5f78de9d840fee8755963fccaaa67
    permissions:
      contents: read
    with:
      strict: true

  changed_scope:
    name: Classify changed scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test_path: ${{ steps.classify.outputs.test_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Select native, hook-contract, or no Rust-affecting tests
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          test_path="$(python3 scripts/ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" | sed -n 's/^test path: //p')"
          test -n "$test_path"
          printf 'test_path=%s\n' "$test_path" >> "$GITHUB_OUTPUT"

  # Formatting and lockfile-tool failures report before native compilation.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Lockfile tool contracts
        run: python3 -m unittest discover -s scripts/tests -v

  # Wall-time history: the single Tests job was compile-bound (Native tests
  # step 18.4m = test-profile COMPILE 18m19s, execution seconds for 1225
  # tests; run 37647606546). sccache (GHA backend, content-keyed) already
  # supplies cross-run workspace-crate artifacts (64% hits on that run: 9
  # hits / 5 misses, the misses being PR-touched crates no cache can fix),
  # so the remaining lever is parallel shards over the shared sccache
  # backend: each shard compiles with mostly hits on a warm cache and
  # --partition only divides the seconds of execution plus per-shard setup.
  # No serial archive stage: CFDrs PR 490 proved the archive+download round
  # trip matches the single job exactly. Target: each shard under 5 minutes
  # warm; a PR that retouches workspace crates still recompiles them in
  # every shard (cold wall ~= single-job wall), which is why the shard
  # timeout below admits a cold compile instead of timing out legitimate
  # cache-seeding runs.
  tests:
    name: Tests (shard ${{ matrix.shard }} of 3)
    needs: changed_scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    env:
      # Content-keyed compiler cache (mozilla-actions/sccache-action, GHA
      # backend): sccache hashes source content plus compiler flags, so it
      # stays safe across the workspace-crate freshness hazard that ruled
      # out mtime-based workspace-crate caching (Coeus#455). The dependency
      # graph was already a full Swatinem/rust-cache hit (0 third-party
      # recompiles, run 36487415471); sccache targets the remaining cost,
      # the 14 first-party workspace crates rust-cache does not and should
      # not cache by mtime. Shared across all shards: content keys match
      # whatever job compiled them.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require changed-scope classification
        if: always()
        run: test -n "${{ needs.changed_scope.outputs.test_path }}"
      - name: Hook-contract tests
        if: needs.changed_scope.outputs.test_path == 'hook-only' && matrix.shard == 1
        # The job-level wrapper names sccache, which only the native path
        # installs below; the lock-regeneration test runs cargo without it.
        # Runs on shard 1 only: one invocation covers the hook suite.
        env:
          RUSTC_WRAPPER: ""
        run: python3 -B -m unittest scripts.tests.test_hooks -v
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        if: needs.changed_scope.outputs.test_path == 'native'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: needs.changed_scope.outputs.test_path == 'native'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        if: needs.changed_scope.outputs.test_path == 'native'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e # nextest
        if: needs.changed_scope.outputs.test_path == 'native'
        with:
          tool: nextest

      # `coeus-wgpu` is excluded because its tests acquire a GPU adapter and
      # fail on a bare runner with `AdapterUnavailable`. It is not skipped
      # coverage: backend-parity.yml runs its check, clippy at -D warnings,
      # nextest and doctests on a runner with mesa-vulkan-drivers installed.
      #
      # `coeus-python` is excluded from both: PyO3's `extension-module` tells
      # it not to link libpython, because a loaded extension gets those symbols
      # from the interpreter. A standalone test binary has no interpreter, so
      # linking fails with `undefined symbol: _Py_DecRef`. It builds on Windows,
      # which links pythonXY.lib regardless, which is why this passed locally
      # and not here. `python-release.yml` owns that crate's verification.
      - name: Native tests
        if: needs.changed_scope.outputs.test_path == 'native'
        run: cargo nextest run --locked --workspace --exclude coeus-python --exclude coeus-wgpu --partition count:${{ matrix.shard }}/3

      # Shares the `test` profile compile above, so this costs only its own
      # doctest binaries. Runs on shard 1 only: one invocation covers them.
      - name: Documentation tests
        if: needs.changed_scope.outputs.test_path == 'native' && matrix.shard == 1
        run: cargo test --locked --doc --workspace --exclude coeus-python --exclude coeus-wgpu

      - name: sccache stats
        if: always() && needs.changed_scope.outputs.test_path == 'native'
        run: sccache --show-stats

  # Aggregate gate preserving the required-check name. Branch protection
  # requires exactly "Tests"; the shards above report under their own
  # names, so this job folds them back into the one required context
  # (fails when any need is not success). Same established pattern as
  # CFDrs PR 526. No build here, so the timeout is the 5-minute budget.
  test:
    name: Tests
    needs: [changed_scope, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate shard results
        run: |
          for need in changed_scope tests; do
            case "$need" in
              changed_scope) result="${{ needs.changed_scope.result }}" ;;
              tests) result="${{ needs.tests.result }}" ;;
            esac
            if [ "$result" != "success" ]; then
              echo "gate red: $need result is $result" >&2
              exit 1
            fi
          done
          echo "gate green: changed scope classified and all test shards succeeded"

  lint:
    name: Lint and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
