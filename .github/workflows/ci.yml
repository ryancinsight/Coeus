name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info

jobs:
  # =============================================================================
  # Security and Compliance Checks
  # =============================================================================
  security-audit:
    name: Security Audit & Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Check for unsafe code
        run: |
          if grep -r "unsafe" --include="*.rs" . | grep -v "target/"; then
            echo "❌ Unsafe code found!"
            exit 1
          else
            echo "✅ No unsafe code detected"
          fi

      - name: Check licenses
        run: |
          cargo install cargo-license
          cargo license --json | jq '.[] | select(.license | test("MIT|Apache-2.0|BSD-3-Clause|ISC") | not)' | jq -e 'length > 0' && exit 1 || echo "✅ All licenses compliant"

  # =============================================================================
  # Code Quality Checks
  # =============================================================================
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check unused dependencies
        run: |
          cargo install cargo-udeps
          cargo udeps --workspace

  # =============================================================================
  # Unit and Integration Tests
  # =============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@${{ matrix.rust }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace --lib --bins

      - name: Run integration tests
        run: cargo test -p tensor --test integration_tests

      - name: Run doctests
        run: cargo test --workspace --doc

  # =============================================================================
  # Performance Benchmarks
  # =============================================================================
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-criterion
        run: cargo install cargo-criterion

      - name: Run micro-benchmarks
        run: cargo criterion --workspace

      - name: Run profiling benchmarks
        run: |
          cargo build --release --workspace
          ./scripts/benchmark.sh

  # =============================================================================
  # Coverage Analysis
  # =============================================================================
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage analysis
        run: cargo tarpaulin --workspace --out Html --output-dir coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

      - name: Check minimum coverage
        run: |
          cargo tarpaulin --workspace --out Json | jq '.coverage >= 85' | grep true || exit 1

  # =============================================================================
  # GPU Testing (Optional)
  # =============================================================================
  gpu-test:
    name: GPU Tests
    runs-on: [self-hosted, gpu]
    if: contains(github.event.pull_request.labels.*.name, 'gpu-test') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit

      - name: Run GPU tests
        run: cargo test --workspace --features gpu -- --test-threads=1
        env:
          CUDA_VISIBLE_DEVICES: 0

  # =============================================================================
  # Cross-Platform Testing
  # =============================================================================
  cross-platform:
    name: Cross-Platform Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --lib

  # =============================================================================
  # Memory Safety Verification
  # =============================================================================
  memory-safety:
    name: Memory Safety Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Miri
        run: rustup component add miri

      - name: Run Miri
        run: cargo miri test --workspace
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # =============================================================================
  # Documentation Build
  # =============================================================================
  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Build mdBook docs
        run: |
          cargo install mdbook mdbook-mermaid
          mdbook build docs/

      - name: Upload documentation
        uses: actions/upload-artifact@v3
        with:
          name: documentation
          path: |
            target/doc/
            docs/book/

  # =============================================================================
  # Docker Build Test
  # =============================================================================
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: development
          tags: coeus:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          tags: coeus:latest
          cache-from: type=gha

      - name: Test container
        run: |
          docker run --rm coeus:latest coeus_tensor --version
          docker run --rm coeus:dev cargo --version

  # =============================================================================
  # Python Bindings Test
  # =============================================================================
  python-bindings:
    name: Python Bindings Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy torch

      - name: Build Python bindings
        run: |
          cd pycoeus
          maturin develop

      - name: Test Python bindings
        run: |
          cd pycoeus
          python -c "import coeus; print('Python bindings working')"
          python -m pytest tests/ -v

  # =============================================================================
  # Performance Regression Check
  # =============================================================================
  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run performance baseline
        run: |
          cargo build --release --workspace
          ./scripts/performance-baseline.sh

      - name: Check for regressions
        run: |
          # Compare against stored baseline
          ./scripts/check-regression.sh

  # =============================================================================
  # Release Preparation
  # =============================================================================
  release-check:
    name: Release Preparation
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check release readiness
        run: |
          # Verify all tests pass
          cargo test --workspace --release

          # Check documentation
          cargo doc --workspace --no-deps

          # Verify no debug prints in release
          ! grep -r "println!" --include="*.rs" . || exit 1

          # Check version consistency
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Release version: $VERSION"

      - name: Create release archive
        run: |
          cargo build --release --workspace
          tar -czf coeus-${{ github.ref_name }}.tar.gz -C target/release \
            coeus_tensor \
            coeus_nn \
            coeus_backend

      - name: Upload release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts
          path: |
            *.tar.gz
            target/doc/
            docs/book/

  # =============================================================================
  # Deployment (Manual Trigger Only)
  # =============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [security-audit, code-quality, test, coverage, docs, docker]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/coeus:latest .
          docker push ${{ secrets.ECR_REGISTRY }}/coeus:latest

      - name: Deploy to Kubernetes
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }}
          kubectl apply -f deployment/kubernetes/
          kubectl rollout status deployment/coeus-deployment

      - name: Run post-deployment tests
        run: |
          ./scripts/post-deployment-test.sh

  # =============================================================================
  # Final Status Check
  # =============================================================================
  finalize:
    name: CI/CD Final Status
    runs-on: ubuntu-latest
    if: always()
    needs: [security-audit, code-quality, test, coverage, cross-platform, memory-safety, docs, docker]
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "❌ Security audit failed"
            exit 1
          fi
          if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Code quality check failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "❌ Coverage check failed"
            exit 1
          fi
          echo "✅ All CI/CD checks passed"

      - name: Generate CI report
        run: |
          echo "## CI/CD Status Report" > ci-report.md
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> ci-report.md
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> ci-report.md
          echo "- Tests: ${{ needs.test.result }}" >> ci-report.md
          echo "- Coverage: ${{ needs.coverage.result }}" >> ci-report.md
          echo "- Cross-Platform: ${{ needs.cross-platform.result }}" >> ci-report.md
          echo "- Memory Safety: ${{ needs.memory-safety.result }}" >> ci-report.md
          echo "- Documentation: ${{ needs.docs.result }}" >> ci-report.md
          echo "- Docker: ${{ needs.docker.result }}" >> ci-report.md

      - name: Upload CI report
        uses: actions/upload-artifact@v3
        with:
          name: ci-report
          path: ci-report.md
