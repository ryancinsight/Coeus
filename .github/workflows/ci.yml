name: CI

# This repository ran no general verification. `backend-parity.yml` exercises
# the WGPU, CUDA and Metal provider contracts on device-specific runners, and
# the rest of the workflows publish or build the book -- so the workspace's
# native tests and doctests were committed, maintained, and executed by
# nothing. This runs 1130 of them; the two exclusions below account for the
# rest and are covered by the workflows named there.
#
# All of them pass, and so now do `cargo fmt --check`, `cargo doc` with
# `RUSTDOCFLAGS=-D warnings`, and clippy at `-D warnings` across the workspace.
# Clippy did not when this workflow landed: 41 diagnostics stood, 31 of them a
# mechanical `.get(0)` to `.first()` across 23 files, so it ran without `-D
# warnings` while the burn-down was tracked separately. That is finished, and
# the gate is a gate.
#
# The work is split across two jobs because it is compile-bound, not test-bound:
# the first attempt ran everything in one job and was killed at the 30-minute
# limit inside `cargo doc`, having spent 26m52s compiling the workspace at the
# `test` profile to then run all 1130 tests in 4.1 seconds. The `test`, `doc`
# and clippy profiles each need their own compile, so serially they do not fit
# any reasonable bound; in parallel each job carries one and does. Splitting
# also gives each job its own cache entry, which is why `save-if` matters below:
# no pull-request run may write one, so the entries come from `main`, and until
# `main` has run this workflow once every job here pays a cold compile.
#
# The 45-minute bounds are sized for that cold compile, not for steady state:
# a restored cache should put both jobs in single digits. If it does not once
# `main` has populated one, the bound is hiding something and the job is owed
# an investigation rather than more minutes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coeus-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # `rust-toolchain.toml` pins 1.97.0, so every cargo call here uses it whatever
  # the action installs. Without this the action defaults to `stable` -- its own
  # log line reads `toolchain: stable` -- and rustup then fetches 1.97.0 as a
  # second toolchain on first use, with the action's `components:` having been
  # installed for the one that does not run. Same value and same mechanism as
  # backend-parity.yml.
  RUST_TOOLCHAIN: 1.97.0

jobs:
  adr-index:
    name: ADR index is current
    # atlas owns the one generator (ATLAS-ADR-FORM-NORMALIZATION-2026-09-02); strict: the ADRs carry the canonical heading form and numbering.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@378081ec6cb04da4009253ecfb25e8b6966aa4e2
    permissions:
      contents: read
    with:
      strict: true

  # Cheapest gate on its own runner: a formatting slip reports in under a
  # minute instead of behind a compile.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e # nextest
        with:
          tool: nextest

      # `coeus-wgpu` is excluded because its tests acquire a GPU adapter and
      # fail on a bare runner with `AdapterUnavailable`. It is not skipped
      # coverage: backend-parity.yml runs its check, clippy at -D warnings,
      # nextest and doctests on a runner with mesa-vulkan-drivers installed.
      #
      # `coeus-python` is excluded from both: PyO3's `extension-module` tells
      # it not to link libpython, because a loaded extension gets those symbols
      # from the interpreter. A standalone test binary has no interpreter, so
      # linking fails with `undefined symbol: _Py_DecRef`. It builds on Windows,
      # which links pythonXY.lib regardless, which is why this passed locally
      # and not here. `python-release.yml` owns that crate's verification.
      - name: Native tests
        run: cargo nextest run --locked --workspace --exclude coeus-python --exclude coeus-wgpu

      # Shares the `test` profile compile above, so this costs only its own
      # doctest binaries.
      - name: Documentation tests
        run: cargo test --locked --doc --workspace --exclude coeus-python --exclude coeus-wgpu

  lint:
    name: Lint and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
