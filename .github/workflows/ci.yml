name: CI

# Device-specific contracts run in backend-parity.yml. Native tests and
# documentation compile in separate jobs to retain their existing cache and
# time budgets. Pull requests restore caches; only main updates them.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: coeus-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # `rust-toolchain.toml` pins 1.97.0, so every cargo call here uses it whatever
  # the action installs. Without this the action defaults to `stable` -- its own
  # log line reads `toolchain: stable` -- and rustup then fetches 1.97.0 as a
  # second toolchain on first use, with the action's `components:` having been
  # installed for the one that does not run. Same value and same mechanism as
  # backend-parity.yml.
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # Public-surface compatibility, informational on pull requests: the
  # detected change class is visible while the change is still in
  # review. The blocking comparison runs on release.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@1ba4a8a4ffba9aa06b8f9192cbe43423cd34985a
    with:
      package: coeus-autograd,coeus-core,coeus-dist,coeus-fft,coeus-hephaestus,coeus-leto,coeus-metal,coeus-nn,coeus-ops,coeus-optim,coeus-rocm,coeus-sparse,coeus-tensor,coeus-wgpu
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  adr-index:
    name: ADR index is current
    # atlas owns the one generator (ATLAS-ADR-FORM-NORMALIZATION-2026-09-02); strict: the ADRs carry the canonical heading form and numbering.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@191617bffed5f78de9d840fee8755963fccaaa67
    permissions:
      contents: read
    with:
      strict: true

  # Formatting and lockfile-tool failures report before native compilation.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Lockfile tool contracts
        run: python3 -m unittest discover -s scripts/tests -v

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e # nextest
        with:
          tool: nextest

      # `coeus-wgpu` is excluded because its tests acquire a GPU adapter and
      # fail on a bare runner with `AdapterUnavailable`. It is not skipped
      # coverage: backend-parity.yml runs its check, clippy at -D warnings,
      # nextest and doctests on a runner with mesa-vulkan-drivers installed.
      #
      # `coeus-python` is excluded from both: PyO3's `extension-module` tells
      # it not to link libpython, because a loaded extension gets those symbols
      # from the interpreter. A standalone test binary has no interpreter, so
      # linking fails with `undefined symbol: _Py_DecRef`. It builds on Windows,
      # which links pythonXY.lib regardless, which is why this passed locally
      # and not here. `python-release.yml` owns that crate's verification.
      - name: Native tests
        run: cargo nextest run --locked --workspace --exclude coeus-python --exclude coeus-wgpu

      # Shares the `test` profile compile above, so this costs only its own
      # doctest binaries.
      - name: Documentation tests
        run: cargo test --locked --doc --workspace --exclude coeus-python --exclude coeus-wgpu

  lint:
    name: Lint and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
