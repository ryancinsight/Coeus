[package]
name = "coeus-cuda"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
coeus-core   = { workspace = true }
coeus-tensor = { workspace = true }
coeus-ops    = { workspace = true }
leto-ops     = { workspace = true }
libloading   = "0.8"
bytemuck     = { workspace = true }
thiserror    = { workspace = true }
half         = { workspace = true }
cutile       = { git = "https://github.com/NVlabs/cutile-rs", optional = true }
cuda-core    = { git = "https://github.com/NVlabs/cutile-rs", package = "cuda-core", optional = true }
cuda-async   = { git = "https://github.com/NVlabs/cutile-rs", package = "cuda-async", optional = true }

[features]
default = []
cuda = ["dep:cutile", "dep:cuda-core", "dep:cuda-async"]

