[package]
name = "coeus-dtype"
description = "Core data types for Coeus deep learning framework"
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "tensor", "dtype", "numerics"]
categories = ["science", "mathematics", "data-structures"]
documentation = "https://docs.rs/coeus-dtype"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["std", "simd", "serde", "complex"]
std = ["num-traits/std"]
simd = []
half = ["dep:half"]
complex = ["dep:num-complex"]
quantized = []
serde = ["dep:serde"]

[dependencies]
num-traits.workspace = true
thiserror.workspace = true
libm.workspace = true
half = { workspace = true, optional = true }
num-complex = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
approx.workspace = true

