[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

[test-groups]
gpu-tests = { max-threads = 1 }
tcp-tests = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(coeus-cuda) | package(coeus-wgpu)'
test-group = 'gpu-tests'

[[profile.default.overrides]]
filter = 'package(coeus-dist) & test(/^tcp::/)'
test-group = 'tcp-tests'
