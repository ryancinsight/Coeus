[package]
name = "coeus-sparse"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Sparse numerical kernels and high-level operations for Coeus"
readme = "../README.md"
keywords = ["sparse", "tensor", "machine-learning", "linear-algebra"]
categories = ["science", "mathematics"]

[lib]
path = "src/lib.rs"

[dependencies]
dtype.workspace = true
storage.workspace = true
quantization.workspace = true
coeus-error.workspace = true
num-traits.workspace = true
tracing.workspace = true
backend.workspace = true
bytemuck = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
gpu = ["dep:bytemuck", "dep:wgpu", "dep:async-trait", "dep:futures", "dep:tokio"]

[dev-dependencies]
approx.workspace = true
rand.workspace = true
tensor.workspace = true
