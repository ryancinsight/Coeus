[package]
name = "profiling"
version.workspace = true
edition = "2021"
description = "Performance profiling and benchmarking utilities for Coeus"
readme = "../README.md"
repository = "https://github.com/your-org/coeus"
keywords = ["profiling", "benchmarking", "performance", "rust", "deep-learning"]
categories = ["development-tools", "science"]
license = "MIT OR Apache-2.0"

[dependencies]
# Workspace dependencies
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time measurement
instant = { version = "0.1", features = ["wasm-bindgen"] }

# Error handling
thiserror = { workspace = true }

# Statistics
statrs = "0.4"

# Optional: Memory profiling
memory-stats = { version = "1.2", optional = true }

[features]
default = ["std"]
std = []

# Enable memory profiling on supported platforms
memory_profiling = ["dep:memory-stats"]

[dev-dependencies]
criterion = { workspace = true }
