[package]
name = "coeus-vision"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@protomail.com>"]
description = "Vision transforms and image IO for Coeus"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/Coeus"
readme = "../README.md"
keywords = ["vision", "image", "transforms", "torchvision"]
categories = ["science", "mathematics"]

[dependencies]
backend = { path = "../backend", version = "0.2.0" }
dtype = { path = "../dtype", version = "0.2.0" }
storage = { path = "../storage", version = "0.2.0" }
tensor = { path = "../tensor", version = "0.2.0" }
utils = { path = "../utils", version = "0.2.0" }

thiserror = { workspace = true }
rand = { workspace = true }

image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
proptest = { workspace = true }

