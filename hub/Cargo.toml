[package]
name = "hub"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Model hub and pretrained model management for Coeus deep learning framework"
readme = "README.md"
keywords = ["deep-learning", "model-hub", "pretrained-models", "pytorch"]
categories = ["science", "algorithms"]

[dependencies]
# Workspace dependencies
tensor = { path = "../tensor" }
autograd = { path = "../autograd" }
backend = { path = "../backend" }
nn = { path = "../nn" }
storage = { path = "../storage" }
dtype = { path = "../dtype" }

# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }

# HTTP client for downloading models
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# JSON parsing
serde_json = { workspace = true }

# Semver for model versioning
semver = "1.0"

# Hash collections
indexmap = "2.0"

# Path handling
dirs = "5.0"

# File system operations
fs2 = "0.4"

# Logging
tracing = { workspace = true }

# Test utilities
tempfile = "3.0"
