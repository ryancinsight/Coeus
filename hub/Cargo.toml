[package]
name = "coeus-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyTorch Hub-compatible model loading and management for Coeus"

[dependencies]
coeus-tensor = { workspace = true }
coeus-backend = { workspace = true }
coeus-nn = { workspace = true }
coeus-dtype = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-pickle = "1.0"

# HTTP client for model downloads
reqwest = { version = "0.11", features = ["blocking", "json"] }

# Async support
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# File system operations
fs-err = "2.9"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
log = "0.4"

# URL parsing
url = "2.4"

# Hash verification
sha2 = "0.10"
hex = "0.4"

# Directories
dirs = "5.0"

[dev-dependencies]
tempfile = "3.8"
mockito = "1.2"
coeus-models = { path = "../models" }
