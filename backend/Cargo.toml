[package]
name = "coeus-backend"
version = "0.1.0"
edition = "2021"
description = "Backend abstraction layer for CPU/GPU tensor operations in Coeus"
keywords = ["machine-learning", "tensor", "backend", "gpu", "cpu"]
categories = ["science", "algorithms"]

[dependencies]
coeus-dtype = { path = "../dtype" }
wgpu = { version = "0.19", features = ["spirv"] }
pollster = "0.3"
thiserror = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
async-trait = "0.1"
bytemuck = { version = "1.14", features = ["derive"] }
futures-intrusive = "0.5"
futures = "0.3"
num-traits = "0.2"
rand = "0.8"
rand_distr = "0.4"
libloading = "0.8"
semver = "1.0"
tracing = "0.1"
# cudnn-sys = { version = "0.1", optional = true }  # For cuDNN FFI - disabled due to version conflicts
# tflite-sys = "0.1"  # For TFLite FFI - disabled due to version conflicts
prost = "0.12"
prost-types = "0.12"
half = "2.6"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
proptest = "1.7"
approx = { workspace = true }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
criterion = { workspace = true }

[lib]
name = "coeus_backend"
path = "src/lib.rs"

[[example]]
name = "gpu_bench"
path = "examples/gpu_bench.rs"
