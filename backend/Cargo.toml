[package]
name = "coeus-backend"
description = "Compute backend abstractions for Coeus tensors"
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "tensor", "backend", "cpu"]
categories = ["science", "algorithms"]
documentation = "https://docs.rs/coeus-backend"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["std", "cpu", "gpu"]
std = []
cpu = []
gpu = ["std", "dep:wgpu", "dep:pollster", "dep:futures-intrusive", "dep:bytemuck"]
npu = ["std"]
tpu = ["std"]

[dependencies]
coeus-dtype = { path = "../dtype" }
coeus-storage = { path = "../storage" }
thiserror.workspace = true
wgpu = { version = "0.19", optional = true }
pollster = { version = "0.3", optional = true }
futures-intrusive = { version = "0.5", optional = true }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

