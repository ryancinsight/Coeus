[package]
name = "coeus-backend"
version = "0.1.0"
edition = "2021"
description = "Backend abstraction layer for CPU/GPU tensor operations in Coeus"
keywords = ["machine-learning", "tensor", "backend", "gpu", "cpu"]
categories = ["science", "algorithms"]

[dependencies]
coeus-dtype = { path = "../dtype" }
wgpu = { version = "0.19", features = ["spirv"] }
pollster = "0.3"
thiserror = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
async-trait = "0.1"
bytemuck = { version = "1.14", features = ["derive"] }
futures-intrusive = "0.5"
num-traits = "0.2"

[dev-dependencies]
approx = { workspace = true }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
