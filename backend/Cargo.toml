[package]
name = "backend"
description = "Compute backend abstractions for Coeus tensors"
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "tensor", "backend", "cpu"]
categories = ["science", "algorithms"]
documentation = "https://docs.rs/coeus-backend"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["std", "cpu", "gpu"]
std = []
cpu = []
gpu = ["std", "dep:wgpu", "dep:pollster", "dep:futures-intrusive", "dep:bytemuck", "dep:tokio", "dep:futures"]
npu = ["std"]
tpu = ["std"]
serde = ["dep:serde"]

[dependencies]
dtype.workspace = true
storage.workspace = true
thiserror.workspace = true
libm.workspace = true
rand.workspace = true
serde = { version = "1.0", features = ["derive"], optional = true }
num_cpus = "1.16"
wgpu = { version = "0.19", optional = true }
pollster = { version = "0.3", optional = true }
futures-intrusive = { version = "0.5", optional = true }
bytemuck = { workspace = true, optional = true }
tokio = { version = "1.0", features = ["sync"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { version = "1.0", features = ["macros", "rt"] }
