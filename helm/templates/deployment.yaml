apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coeus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coeus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  strategy:
    type: {{ .Values.deployment.strategy.type }}
    {{- if eq .Values.deployment.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.deployment.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.deployment.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "coeus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coeus.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.deployment.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.config.models.gpuAcceleration }}
      # GPU node affinity
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values:
                - "true"
        {{- with .Values.deployment.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}

      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
      - name: semantic-api
        {{- if .Values.config.models.gpuAcceleration }}
        image: {{ .Values.gpuImage.repository }}:{{ .Values.gpuImage.tag | default .Chart.AppVersion }}
        {{- else }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        {{- end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        {{- with .Values.deployment.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}

        env:
        - name: RUST_LOG
          value: {{ .Values.config.logging.level | quote }}
        - name: COEUS_MODEL_CACHE_DIR
          value: {{ .Values.config.models.cacheDir | quote }}
        - name: COEUS_DATA_DIR
          value: "/app/data"
        - name: COEUS_PORT
          value: {{ .Values.config.server.port | quote }}
        - name: COEUS_WORKERS
          value: {{ .Values.config.server.workers | quote }}
        - name: COEUS_CLIP_MODEL
          value: {{ .Values.config.models.clipModel | quote }}
        - name: COEUS_GPU_ACCELERATION
          value: {{ .Values.config.models.gpuAcceleration | quote }}
        - name: COEUS_METRICS_ENABLED
          value: {{ .Values.config.monitoring.metricsEnabled | quote }}
        - name: COEUS_PROFILING_ENABLED
          value: {{ .Values.config.monitoring.profilingEnabled | quote }}

        ports:
        - containerPort: {{ .Values.config.server.port }}
          name: http
          protocol: TCP

        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.config.server.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.config.server.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: {{ .Values.config.server.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

        volumeMounts:
        - name: model-cache
          mountPath: {{ .Values.config.models.cacheDir }}
        - name: data-storage
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true

        {{- with .Values.deployment.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}

      {{- if .Values.storage.modelCache.enabled }}
      initContainers:
      - name: model-prep
        image: busybox:latest
        command: ['sh', '-c', 'mkdir -p {{ .Values.config.models.cacheDir }} /app/data /app/logs && chmod 755 {{ .Values.config.models.cacheDir }} /app/data /app/logs']
        volumeMounts:
        - name: model-cache
          mountPath: {{ .Values.config.models.cacheDir }}
        - name: data-storage
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
      {{- end }}

      volumes:
      {{- if .Values.storage.modelCache.enabled }}
      - name: model-cache
        persistentVolumeClaim:
          claimName: {{ include "coeus.fullname" . }}-model-cache
      {{- end }}
      {{- if .Values.storage.dataStorage.enabled }}
      - name: data-storage
        persistentVolumeClaim:
          claimName: {{ include "coeus.fullname" . }}-data-storage
      {{- end }}
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: {{ include "coeus.fullname" . }}-config

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}





