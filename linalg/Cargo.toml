[package]
name = "coeus-linalg"
version = "0.1.0"
edition = "2021"
description = "Linear Algebra operations for Coeus Tensors"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/Coeus"
readme = "../README.md"
keywords = ["linear-algebra", "tensor", "machine-learning"]
categories = ["science", "mathematics"]

[dependencies]
tensor = { path = "../tensor" }
backend = { path = "../backend" }
dtype = { path = "../dtype" }
storage = { path = "../storage" }
coeus-error = { path = "../coeus-error" }
num-traits = "0.2"
tracing = "0.1"

[features]
default = ["std"]
std = []
