[package]
name = "coeus-models"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Llama.cpp-like model loading, inference, and quantization for Coeus"

[dependencies]
# Workspace dependencies
# coeus-tensor = { workspace = true }  # TEMPORARILY DISABLED - architectural redesign required
coeus-nn = { workspace = true }
coeus-hub = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# File system and I/O
fs-err = "2.9"
memmap2 = "0.9"

# Async support
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# HTTP client for model downloads
reqwest = { version = "0.11", features = ["blocking", "json", "stream"] }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Hash verification
sha2 = "0.10"
hex = "0.4"

# Directories
dirs = "5.0"

# Performance and parallel processing
rayon.workspace = true
num_cpus = "1.16"

# Logging
log = "0.4"
env_logger = "0.10"

# Optional dependencies for advanced features
half = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.8"
criterion = { workspace = true }

[features]
default = []
quantization = ["half"]
fft = ["rustfft"]

[[bench]]
name = "inference_benchmark"
harness = false
