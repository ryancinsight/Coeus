apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coeus-semantic-api-hpa
  namespace: ai-platform
  labels:
    app: coeus-semantic-api
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coeus-semantic-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: coeus-semantic-api-monitor
  namespace: ai-platform
  labels:
    app: coeus-semantic-api
    component: monitoring
spec:
  selector:
    matchLabels:
      app: coeus-semantic-api
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: coeus-alerts
  namespace: ai-platform
  labels:
    app: coeus
    component: alerting
spec:
  groups:
  - name: coeus.rules
    rules:
    - alert: CoeusHighCPUUsage
      expr: rate(container_cpu_usage_seconds_total{pod=~"coeus-semantic-api-.*"}[5m]) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected"
        description: "CPU usage is above 80% for more than 5 minutes"

    - alert: CoeusHighMemoryUsage
      expr: container_memory_usage_bytes{pod=~"coeus-semantic-api-.*"} / container_spec_memory_limit_bytes > 0.9
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected"
        description: "Memory usage is above 90% for more than 3 minutes"

    - alert: CoeusPodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total{pod=~"coeus-semantic-api-.*"}[10m]) > 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod crash looping detected"
        description: "Pod has restarted more than 3 times in the last 10 minutes"

    - alert: CoeusAPIHighErrorRate
      expr: rate(http_requests_total{status=~"5..", pod=~"coeus-semantic-api-.*"}[5m]) / rate(http_requests_total{pod=~"coeus-semantic-api-.*"}[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High API error rate detected"
        description: "API error rate is above 5% for more than 5 minutes"















