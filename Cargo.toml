[workspace]
members = [
    "dtype",
    "backend",
    "autograd",
    "tensor",
    "nn",
    "optim",
    "utils",
    "fft",
    "hub",
    "examples",
    "pycoeus",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Coeus Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/coeus"
description = "PyTorch-like tensor library in Rust with automatic differentiation"

[workspace.dependencies]
num-traits = "0.2"
num-complex = "0.4"
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
crossbeam = "0.8"
approx = "0.5"
half = { version = "2.1", features = ["num-traits"] }
rand = "0.8"
rand_distr = "0.4"
rustfft = "6.1"
criterion = { version = "0.5", features = ["html_reports"] }

# Workspace-local dependencies
coeus-dtype = { path = "dtype" }
coeus-tensor = { path = "tensor" }
coeus-autograd = { path = "autograd" }
coeus-backend = { path = "backend" }
coeus-nn = { path = "nn" }
coeus-optim = { path = "optim" }
coeus-utils = { path = "utils" }
coeus-fft = { path = "fft" }
coeus-hub = { path = "hub" }
