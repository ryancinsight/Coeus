[workspace]
resolver = "2"

members = [
    "coeus-core",
    "coeus-tensor",
    "coeus-ops",
    "coeus-autograd",
    "coeus-nn",
    "coeus-optim",
    "coeus-python",
    "coeus-sparse",
    "coeus-wgpu",
    "coeus-cuda",
    "coeus-dist",
    "coeus-leto",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── Remote System Dependencies ──
# Parallelization/async SSOT. Moirai defaults carry parallel execution,
# Mnemosyne-backed allocation surfaces, and Mellinoe branding.
moirai     = { git = "https://github.com/ryancinsight/Moirai.git" }
mnemosyne  = { git = "https://github.com/ryancinsight/Mnemosyne.git" }
apollo-fft = { git = "https://github.com/ryancinsight/apollo.git", package = "apollo-fft" }
# SIMD-effect SSOT. Tracks hermes `main`; advance with `cargo update -p hermes-simd`.
hermes-simd = { git = "https://github.com/ryancinsight/hermes.git", package = "hermes-simd" }
# Shared non-differentiable array substrate (layout/storage/views/CPU kernels).
# coeus-leto adapts coeus's dynamic-rank layout onto leto's const-rank kernels;
# the const-rank dispatch shim is consumer-owned here per leto ADR 0002.
# Advance with `cargo update -p leto -p leto-ops`.
leto     = { git = "https://github.com/ryancinsight/leto.git", rev = "d8d34c617da453360931e50358e645743918962f" }
leto-ops = { git = "https://github.com/ryancinsight/leto.git", rev = "d8d34c617da453360931e50358e645743918962f" }

# ── Numerical ──
num-traits = "0.2"
bytemuck   = { version = "1.13", features = ["derive", "extern_crate_std"] }
half       = { version = "2.7", features = ["num-traits", "bytemuck"] }
# ndarray is intentionally absent: coeus implements its own tensor/array stack
# (coeus-tensor). It may still appear transitively inside apollo-fft (an
# ndarray-based FFT crate), but coeus's own code does not depend on it.
smallvec   = "1.13"
wgpu       = { version = "26.0", features = ["wgsl"] }
hephaestus-wgpu = { git = "https://github.com/ryancinsight/hephaestus.git", package = "hephaestus-wgpu" }
hephaestus-core = { git = "https://github.com/ryancinsight/hephaestus.git", package = "hephaestus-core" }

# ── Error ──
thiserror = "2"

# ── Python ──
pyo3 = { version = "0.23", features = ["extension-module"] }

# ── Local ──
coeus-core     = { path = "coeus-core" }
coeus-tensor   = { path = "coeus-tensor" }
coeus-ops      = { path = "coeus-ops" }
coeus-autograd = { path = "coeus-autograd" }
coeus-nn       = { path = "coeus-nn" }
coeus-optim    = { path = "coeus-optim" }
coeus-sparse   = { path = "coeus-sparse" }
coeus-dist     = { path = "coeus-dist" }

[patch."https://github.com/ryancinsight/Mnemosyne.git"]
mnemosyne = { path = "../mnemosyne/crates/mnemosyne" }
mnemosyne-core = { path = "../mnemosyne/crates/mnemosyne-core" }
mnemosyne-arena = { path = "../mnemosyne/crates/mnemosyne-arena" }
mnemosyne-local = { path = "../mnemosyne/crates/mnemosyne-local" }
mnemosyne-heap = { path = "../mnemosyne/crates/mnemosyne-heap" }

[patch."https://github.com/ryancinsight/Moirai.git"]
moirai = { path = "../moirai/moirai" }
moirai-core = { path = "../moirai/moirai-core" }
moirai-scheduler = { path = "../moirai/moirai-scheduler" }
moirai-parallel = { path = "../moirai/moirai-parallel" }

[patch."https://github.com/ryancinsight/leto.git"]
leto = { path = "../leto/crates/leto" }
leto-ops = { path = "../leto/crates/leto-ops" }

[patch."https://github.com/ryancinsight/hephaestus.git"]
hephaestus-wgpu = { path = "../hephaestus/crates/hephaestus-wgpu" }
hephaestus-core = { path = "../hephaestus/crates/hephaestus-core" }

[patch."https://github.com/ryancinsight/hermes.git"]
hermes-simd = { path = "../hermes/crates/hermes-simd" }

[patch."https://github.com/ryancinsight/melinoe.git"]
melinoe = { path = "../melinoe" }

[patch."https://github.com/ryancinsight/themis"]
themis = { path = "../themis" }

[patch."https://github.com/ryancinsight/apollo.git"]
apollo-fft = { path = "../apollo/crates/apollo-fft" }

[profile.bench]
codegen-units = 1
lto = "thin"
opt-level = 3
