[workspace]
resolver = "2"

members = [
    "crates/coeus-core",
    "crates/coeus-tensor",
    "crates/coeus-ops",
    "crates/coeus-autograd",
    "crates/coeus-nn",
    "crates/coeus-optim",
    "crates/coeus-python",
    "crates/coeus-sparse",
    "crates/coeus-wgpu",
    "crates/coeus-cuda",
    "crates/coeus-hephaestus",
    "crates/coeus-rocm",
    "crates/coeus-metal",
    "crates/coeus-dist",
    "crates/coeus-leto",
    "crates/coeus-fft",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/Coeus.git"
readme = "README.md"
keywords = ["tensor", "autodiff", "gpu", "machine-learning", "simd"]
categories = ["science", "mathematics", "data-structures"]

[workspace.dependencies]
# First-party providers remain Git-sourced for standalone and CI resolution.
# The Atlas stack overlay redirects these exact sources to one local checkout
# during development, so a worktree never creates a second package identity.
moirai = { package = "moirai-runtime", git = "https://github.com/ryancinsight/Moirai.git", version = "0.5.0", features = ["melinoe"] }
moirai-async = { git = "https://github.com/ryancinsight/Moirai.git", version = "0.5.0" }
mnemosyne = { package = "mnemosyne-memory", git = "https://github.com/ryancinsight/Mnemosyne.git", version = "0.7.0" }
# SIMD-effect SSOT.
hermes-simd = { git = "https://github.com/ryancinsight/hermes.git", version = "0.7.0" }
eunomia = { git = "https://github.com/ryancinsight/eunomia.git", version = "0.8.0", default-features = false }
# Shared non-differentiable array substrate (layout/storage/views/CPU kernels).
leto = { git = "https://github.com/ryancinsight/leto.git", version = "0.42.0" }
leto-ops = { git = "https://github.com/ryancinsight/leto.git", version = "0.42.0" }
apollo-fft = { git = "https://github.com/ryancinsight/apollo.git", version = "0.26.0", default-features = false }

# ── Numerical ──
bytemuck   = { version = "1.13", features = ["derive", "extern_crate_std"] }
half       = { version = "2.7", features = ["bytemuck"] }
# ndarray is intentionally absent: coeus implements its own tensor/array stack
# (coeus-tensor). FFT integration routes through Atlas-owned Apollo APIs rather
# than rustfft or a Coeus-local array dependency.
smallvec   = "1.13"
rkyv       = { version = "0.8.17", features = ["bytecheck", "std"] }
wgpu       = { version = "30.0", default-features = false, features = ["wgsl", "vulkan", "metal"] }
# Accelerator providers remain Git-sourced and lockfile-pinned.
hephaestus-wgpu = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0" }
hephaestus-core = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0" }
hephaestus-cuda = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0", default-features = false }
hephaestus-rocm = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0" }
hephaestus-metal = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0" }
themis = { package = "themis-topology", git = "https://github.com/ryancinsight/themis.git", version = "0.10.1" }
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.9.0" }

# ── Error ──
thiserror = "2"

# ── Benchmarking ──
criterion = "0.5"

# ── Python ──
pyo3 = { version = "0.23", features = ["extension-module"] }

# ── Local ──
coeus-core     = { version = "0.10.0", path = "crates/coeus-core" }
coeus-tensor   = { version = "0.10.0", path = "crates/coeus-tensor" }
coeus-ops      = { version = "0.10.0", path = "crates/coeus-ops", default-features = false }
coeus-hephaestus = { version = "0.10.0", path = "crates/coeus-hephaestus" }
coeus-autograd = { version = "0.10.0", path = "crates/coeus-autograd", default-features = false }
coeus-nn       = { version = "0.10.0", path = "crates/coeus-nn", default-features = false }
coeus-optim    = { version = "0.10.0", path = "crates/coeus-optim", default-features = false }
coeus-sparse   = { version = "0.10.0", path = "crates/coeus-sparse" }
coeus-dist     = { version = "0.10.0", path = "crates/coeus-dist", default-features = false }
coeus-fft      = { version = "0.10.0", path = "crates/coeus-fft" }

[profile.bench]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1

# ATLAS-PATH-DEP-AUDIT-2 round-4 closure

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed
# is a hard error. Counts are `cargo clippy --all-targets` hits at the time
# the floor was established (total / production, production excluding
# `#[cfg(test)]` modules and test, bench and example targets). Burn a class
# down to zero, then delete its line -- the floor tightens, never loosens.

# --- Documentation debt (1359 sites, 795 in production) ---
doc_markdown = "allow"                # 583 (281 prod)
must_use_candidate = "allow"          # 275 (131 prod)
missing_errors_doc = "allow"          # 269 (151 prod)
missing_panics_doc = "allow"          # 162 (162 prod)
return_self_not_must_use = "allow"    # 70 (70 prod)

# --- Numeric conversion debt (1481 sites, 529 in production) ---
cast_precision_loss = "allow"         # 533 (115 prod)
unreadable_literal = "allow"          # 326 (6 prod)
cast_possible_wrap = "allow"          # 250 (174 prod)
cast_sign_loss = "allow"              # 197 (142 prod)
cast_possible_truncation = "allow"    # 116 (70 prod)
cast_lossless = "allow"               # 43 (15 prod)
float_cmp = "allow"                   # 14 (7 prod)
manual_range_contains = "allow"       # 3 (3 prod)
manual_midpoint = "allow"             # 1 (1 prod)

# --- Raw-pointer / layout debt (10 sites, 10 in production) ---
ptr_as_ptr = "allow"                  # 7 (7 prod)
ref_as_ptr = "allow"                  # 3 (3 prod)

# --- Signature and shape debt (211 sites, 126 in production) ---
inline_always = "allow"               # 226 (226 prod)
needless_pass_by_value = "allow"      # 64 (26 prod)
too_many_arguments = "allow"          # 59 (59 prod)
too_many_lines = "allow"              # 44 (29 prod)
type_complexity = "allow"             # 12 (12 prod)
trivially_copy_pass_by_ref = "allow"  # 10 (6 prod)
unnecessary_wraps = "allow"           # 105 (0 prod)
unused_self = "allow"                 # 17 (4 prod)
ref_option = "allow"                  # 3 (3 prod)
struct_excessive_bools = "allow"      # 1 (1 prod)
struct_field_names = "allow"          # 1 (1 prod)

# --- Style debt (1153 sites, 249 in production) ---
semicolon_if_nothing_returned = "allow"    # 599 (3 prod)
similar_names = "allow"                    # 243 (54 prod)
uninlined_format_args = "allow"            # 95 (66 prod)
needless_raw_string_hashes = "allow"       # 57 (36 prod)
wildcard_imports = "allow"                 # 54 (0 prod)
many_single_char_names = "allow"           # 35 (20 prod)
get_first = "allow"                        # 29 (29 prod)
items_after_statements = "allow"           # 25 (9 prod)
manual_let_else = "allow"                  # 21 (2 prod)
option_as_ref_cloned = "allow"             # 14 (14 prod)
needless_range_loop = "allow"              # 12 (9 prod)
redundant_closure_for_method_calls = "allow" # 7 (6 prod)
match_same_arms = "allow"                  # 7 (6 prod)
elidable_lifetime_names = "allow"          # 5 (5 prod)
map_unwrap_or = "allow"                    # 4 (2 prod)
if_not_else = "allow"                      # 4 (3 prod)
format_push_string = "allow"               # 4 (4 prod)
explicit_iter_loop = "allow"               # 3 (1 prod)
single_match_else = "allow"                # 2 (1 prod)
comparison_chain = "allow"                 # 1 (1 prod)
expl_impl_clone_on_copy = "allow"          # 1 (1 prod)

# --- Restriction floor ---
# `unwrap_used` is denied outright: no workspace-wide allow. The 460 existing
# sites (97 in production) are pinned per file by
# `#![expect(clippy::unwrap_used, reason = "ratchet COEUS-UNWRAP-1")]`, which
# self-expires the moment a file's last unwrap goes.
unwrap_used = "deny"
# Library output belongs to `tracing` or the application layer. The example,
# bench and integration-test sites that legitimately print carry per-file
# `#![expect(..., reason = "ratchet COEUS-LINT-1")]`.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
