[workspace]
resolver = "2"

members = [
    "crates/coeus-core",
    "crates/coeus-tensor",
    "crates/coeus-ops",
    "crates/coeus-autograd",
    "crates/coeus-nn",
    "crates/coeus-optim",
    "crates/coeus-python",
    "crates/coeus-sparse",
    "crates/coeus-wgpu",
    "crates/coeus-cuda",
    "crates/coeus-hephaestus",
    "crates/coeus-rocm",
    "crates/coeus-metal",
    "crates/coeus-dist",
    "crates/coeus-leto",
    "crates/coeus-fft",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── Atlas-owned providers ──
# The root Atlas overlay resolves these Git sources to the canonical local
# provider trees during development; the manifest and lockfile retain the
# reproducible Git-source contract used by standalone builds and CI.
moirai = { git = "https://github.com/ryancinsight/Moirai.git", version = "0.4.0", features = ["melinoe"] }
moirai-async = { git = "https://github.com/ryancinsight/Moirai.git", version = "0.4.0" }
mnemosyne = { git = "https://github.com/ryancinsight/Mnemosyne.git", version = "0.6.0" }
hermes-simd = { git = "https://github.com/ryancinsight/hermes.git", version = "0.5.0" }
eunomia = { git = "https://github.com/ryancinsight/eunomia", version = "0.7.0", default-features = false }
leto = { git = "https://github.com/ryancinsight/leto.git", version = "0.40.0" }
leto-ops = { git = "https://github.com/ryancinsight/leto.git", version = "0.40.0" }
apollo-fft = { git = "https://github.com/ryancinsight/apollo", version = "0.25.0", default-features = false }

# ── Numerical ──
bytemuck   = { version = "1.13", features = ["derive", "extern_crate_std"] }
half       = { version = "2.7", features = ["bytemuck"] }
# ndarray is intentionally absent: coeus implements its own tensor/array stack
# (coeus-tensor). FFT integration routes through Atlas-owned Apollo APIs rather
# than rustfft or a Coeus-local array dependency.
smallvec   = "1.13"
rkyv       = { version = "0.8.17", features = ["bytecheck", "std"] }
wgpu       = { version = "30.0", default-features = false, features = ["wgsl", "vulkan", "metal"] }
hephaestus-wgpu = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.18.0" }
hephaestus-core = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.18.0" }
hephaestus-cuda = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.18.0" }
hephaestus-rocm = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.18.0" }
hephaestus-metal = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.18.0" }
themis = { git = "https://github.com/ryancinsight/themis", version = "0.10.1" }
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.9.0" }

# ── Error ──
thiserror = "2"

# ── Benchmarking ──
criterion = "0.5"

# ── Python ──
pyo3 = { version = "0.23", features = ["extension-module"] }

# ── Local ──
coeus-core     = { path = "crates/coeus-core" }
coeus-tensor   = { path = "crates/coeus-tensor" }
coeus-ops      = { path = "crates/coeus-ops", default-features = false }
coeus-autograd = { path = "crates/coeus-autograd", default-features = false }
coeus-nn       = { path = "crates/coeus-nn", default-features = false }
coeus-optim    = { path = "crates/coeus-optim", default-features = false }
coeus-sparse   = { path = "crates/coeus-sparse" }
coeus-dist     = { path = "crates/coeus-dist", default-features = false }
coeus-fft      = { path = "crates/coeus-fft" }

[profile.bench]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1

# ATLAS-PATH-DEP-AUDIT-2 round-4 closure
