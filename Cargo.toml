[workspace]
members = [
    "coeus-error",
    "dtype",
    "storage",
    # "backend",  # Temporarily excluded - structural issues requiring major refactor
    "tensor",
    "autograd",
    "nn",
    "optim",  # Re-enabled for async training completions
    "utils",
    "tokenizer",
    "pycoeus",  # Re-enabled - Python bindings production readiness assessment
    "examples",  # Re-enabled for autograd integration testing
    # "profiling",  # Temporarily excluded - has compilation errors
    "distributed",  # Re-enabled with optim dependency resolved
    "jit",  # Re-enabled - SIMD implementation appears complete and production-ready
    # "hub",  # Temporarily excluded - experimental
]

resolver = "2"

[workspace.dependencies]
# Core numeric traits
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
num-complex = { version = "0.4", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.42", features = ["full", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
async-trait = "0.1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Math functions (no_std compatible)
libm = "0.2"

# Half precision types
half = { version = "2.3" }

# Safe casting between byte arrays and other types
bytemuck = { version = "1.14", features = ["derive"] }

# Performance profiling
cargo-flamegraph = "0.6"

# GPU compute
wgpu = "0.19"

# Development dependencies
proptest = "1.0"
criterion = "0.5"
approx = "0.5"
tracing-test = "0.2"
rand = "0.8"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ryan Clanton"]
repository = "https://github.com/ryancinsight/coeus"
homepage = "https://github.com/ryancinsight/coeus"
rust-version = "1.70"

# Build optimization profiles for performance and size
[profile.release]
# Enable link-time optimization for better performance
lto = true
# Optimize for size while maintaining performance
opt-level = 3
# Strip debug symbols from release builds
strip = true
# Enable panic unwinding for better error messages
panic = "unwind"
# Generate debug info for profiling
debug = false

[profile.bench]
# Same as release but with debug info for profiling
inherits = "release"
debug = true
strip = false

[profile.dev]
# Faster compilation during development
opt-level = 0
# Enable debug assertions
debug = true
# Use panic unwinding for better error messages
panic = "unwind"
