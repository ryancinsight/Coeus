[workspace]
resolver = "2"

members = [
    "crates/coeus-core",
    "crates/coeus-tensor",
    "crates/coeus-ops",
    "crates/coeus-autograd",
    "crates/coeus-nn",
    "crates/coeus-optim",
    "crates/coeus-python",
    "crates/coeus-sparse",
    "crates/coeus-wgpu",
    "crates/coeus-cuda",
    "crates/coeus-hephaestus",
    "crates/coeus-rocm",
    "crates/coeus-metal",
    "crates/coeus-dist",
    "crates/coeus-leto",
    "crates/coeus-fft",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── Local System Dependencies (Atlas monorepo path deps) ──
# Parallelization/async SSOT. Synchronized via local path; Cargo.lock pins
# the coherent provider revisions.
moirai = { path = "../moirai/moirai", features = ["melinoe"] }
moirai-async = { path = "../moirai/moirai-async" }
mnemosyne = { path = "../mnemosyne/crates/mnemosyne" }
# SIMD-effect SSOT.
hermes-simd = { path = "../hermes/crates/hermes-simd" }
eunomia = { path = "../eunomia/crates/eunomia", default-features = false }
# Shared non-differentiable array substrate (layout/storage/views/CPU kernels).
# Path deps for migration (remote leto 0.40.0 predates moirai path dep).
leto = { path = "../leto/crates/leto" }
leto-ops = { path = "../leto/crates/leto-ops" }
# Path dep for migration (remote apollo-fft predates moirai ^0.6.0)
apollo-fft = { path = "../apollo/crates/apollo-fft", default-features = false }

# ── Numerical ──
bytemuck   = { version = "1.13", features = ["derive", "extern_crate_std"] }
half       = { version = "2.7", features = ["bytemuck"] }
# ndarray is intentionally absent: coeus implements its own tensor/array stack
# (coeus-tensor). FFT integration routes through Atlas-owned Apollo APIs rather
# than rustfft or a Coeus-local array dependency.
smallvec   = "1.13"
rkyv       = { version = "0.8.17", features = ["bytecheck", "std"] }
wgpu       = { version = "30.0", default-features = false, features = ["wgsl", "vulkan", "metal"] }
# Path deps for migration (remote hephaestus predates mnemosyne ^0.6.0)
hephaestus-wgpu = { path = "../hephaestus/crates/hephaestus-wgpu" }
hephaestus-core = { path = "../hephaestus/crates/hephaestus-core" }
hephaestus-cuda = { path = "../hephaestus/crates/hephaestus-cuda" }
hephaestus-rocm = { path = "../hephaestus/crates/hephaestus-rocm" }
hephaestus-metal = { path = "../hephaestus/crates/hephaestus-metal" }
themis = { path = "../themis", version = "0.10.1" }
melinoe = { path = "../melinoe", version = "0.9.0" }

# ── Error ──
thiserror = "2"

# ── Benchmarking ──
criterion = "0.5"

# ── Python ──
pyo3 = { version = "0.23", features = ["extension-module"] }

# ── Local ──
coeus-core     = { path = "crates/coeus-core" }
coeus-tensor   = { path = "crates/coeus-tensor" }
coeus-ops      = { path = "crates/coeus-ops", default-features = false }
coeus-autograd = { path = "crates/coeus-autograd", default-features = false }
coeus-nn       = { path = "crates/coeus-nn", default-features = false }
coeus-optim    = { path = "crates/coeus-optim", default-features = false }
coeus-sparse   = { path = "crates/coeus-sparse" }
coeus-dist     = { path = "crates/coeus-dist", default-features = false }
coeus-fft      = { path = "crates/coeus-fft" }

# Keep Git-sourced provider manifests on the same local Atlas instances as the
# workspace dependencies. Without these patches, Aequitas and Hephaestus can
# introduce duplicate provider identities and split shared traits.
[profile.bench]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1

# ATLAS-PATH-DEP-AUDIT-2 round-4 closure
