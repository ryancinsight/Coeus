[workspace]
resolver = "2"

members = [
    "coeus-core",
    "coeus-tensor",
    "coeus-ops",
    "coeus-autograd",
    "coeus-nn",
    "coeus-optim",
    "coeus-python",
    "coeus-sparse",
    "coeus-wgpu",
    "coeus-cuda",
    "coeus-dist",
    "coeus-leto",
    "coeus-fft",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── Remote System Dependencies ──
# Parallelization/async SSOT. Cargo.lock pins the coherent provider revisions;
# the meta-workspace may patch these sources to synchronized local checkouts.
moirai = { version = "0.4.0", git = "https://github.com/ryancinsight/Moirai.git", features = ["melinoe"] }
mnemosyne = { version = "^0.5.0", git = "https://github.com/ryancinsight/Mnemosyne.git" }
# SIMD-effect SSOT.
hermes-simd = { version = "0.4.1", git = "https://github.com/ryancinsight/hermes.git" }
eunomia = { version = "0.7.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
# Shared non-differentiable array substrate (layout/storage/views/CPU kernels).
leto = { version = "0.40.0", git = "https://github.com/ryancinsight/leto.git" }
leto-ops = { version = "0.40.0", git = "https://github.com/ryancinsight/leto.git" }
apollo-fft = { git = "https://github.com/ryancinsight/apollo.git", default-features = false }

# ── Numerical ──
bytemuck   = { version = "1.13", features = ["derive", "extern_crate_std"] }
half       = { version = "2.7", features = ["bytemuck"] }
# ndarray is intentionally absent: coeus implements its own tensor/array stack
# (coeus-tensor). FFT integration routes through Atlas-owned Apollo APIs rather
# than rustfft or a Coeus-local array dependency.
smallvec   = "1.13"
rkyv       = { version = "0.8.17", features = ["bytecheck", "std"] }
wgpu       = { version = "30.0", default-features = false, features = ["wgsl", "vulkan", "metal"] }
hephaestus-wgpu = { version = "0.18.0", git = "https://github.com/ryancinsight/hephaestus.git" }
hephaestus-core = { version = "0.18.0", git = "https://github.com/ryancinsight/hephaestus.git" }
hephaestus-cuda = { version = "0.18.0", git = "https://github.com/ryancinsight/hephaestus.git" }
themis = { version = "0.10", git = "https://github.com/ryancinsight/themis" }
melinoe = { version = "0.9.0", git = "https://github.com/ryancinsight/melinoe.git" }

# ── Error ──
thiserror = "2"

# ── Benchmarking ──
criterion = "0.5"

# ── Python ──
pyo3 = { version = "0.23", features = ["extension-module"] }

# ── Local ──
coeus-core     = { path = "coeus-core" }
coeus-tensor   = { path = "coeus-tensor" }
coeus-ops      = { path = "coeus-ops", default-features = false }
coeus-autograd = { path = "coeus-autograd", default-features = false }
coeus-nn       = { path = "coeus-nn", default-features = false }
coeus-optim    = { path = "coeus-optim", default-features = false }
coeus-sparse   = { path = "coeus-sparse" }
coeus-dist     = { path = "coeus-dist", default-features = false }
coeus-fft      = { path = "coeus-fft" }

[profile.bench]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
