[workspace]
resolver = "2"

members = [
    "crates/coeus-core",
    "crates/coeus-tensor",
    "crates/coeus-ops",
    "crates/coeus-autograd",
    "crates/coeus-nn",
    "crates/coeus-optim",
    "crates/coeus-python",
    "crates/coeus-sparse",
    "crates/coeus-wgpu",
    "crates/coeus-cuda",
    "crates/coeus-hephaestus",
    "crates/coeus-rocm",
    "crates/coeus-metal",
    "crates/coeus-dist",
    "crates/coeus-leto",
    "crates/coeus-fft",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/Coeus.git"
readme = "README.md"
keywords = ["tensor", "autodiff", "gpu", "machine-learning", "simd"]
categories = ["science", "mathematics", "data-structures"]

[workspace.dependencies]
# First-party providers remain Git-sourced for standalone and CI resolution.
# The Atlas stack overlay redirects these exact sources to one local checkout
# during development, so a worktree never creates a second package identity.
moirai = { package = "moirai-runtime", git = "https://github.com/ryancinsight/Moirai.git", version = "0.5.0", features = ["melinoe"] }
moirai-async = { git = "https://github.com/ryancinsight/Moirai.git", version = "0.5.0" }
mnemosyne = { package = "mnemosyne-memory", git = "https://github.com/ryancinsight/Mnemosyne.git", rev = "6ad36da", version = "0.7.0" }
# SIMD-effect SSOT.
hermes-simd = { git = "https://github.com/ryancinsight/hermes.git", version = "0.7.0" }
eunomia = { git = "https://github.com/ryancinsight/eunomia.git", version = "0.8.0", default-features = false }
# Shared non-differentiable array substrate (layout/storage/views/CPU kernels).
leto = { git = "https://github.com/ryancinsight/leto.git", version = "0.42.0" }
leto-ops = { git = "https://github.com/ryancinsight/leto.git", version = "0.42.0" }
apollo-fft = { git = "https://github.com/ryancinsight/apollo.git", version = "0.27.0", default-features = false }

# ── Numerical ──
bytemuck   = { version = "1.13", features = ["derive", "extern_crate_std"] }
# ndarray is intentionally absent: coeus implements its own tensor/array stack
# (coeus-tensor). FFT integration routes through Atlas-owned Apollo APIs rather
# than rustfft or a Coeus-local array dependency.
smallvec   = "1.13"
rkyv       = { version = "0.8.17", features = ["bytecheck", "std"] }
wgpu       = { version = "30.0", default-features = false, features = ["wgsl", "vulkan", "metal"] }
# Accelerator providers remain Git-sourced and lockfile-pinned.
hephaestus-wgpu = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0" }
hephaestus-core = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0" }
hephaestus-cuda = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0", default-features = false }
hephaestus-rocm = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0" }
hephaestus-metal = { git = "https://github.com/ryancinsight/hephaestus.git", version = "0.19.0" }
themis = { package = "themis-topology", git = "https://github.com/ryancinsight/themis.git", version = "0.10.1" }
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.9.0" }

# ── Error ──
thiserror = "2"

# ── Benchmarking ──
criterion = "0.5"

# ── Python ──
pyo3 = { version = "0.23", features = ["extension-module"] }

# ── Local ──
coeus-core     = { version = "0.10.0", path = "crates/coeus-core" }
coeus-tensor   = { version = "0.10.0", path = "crates/coeus-tensor" }
coeus-ops      = { version = "0.10.0", path = "crates/coeus-ops", default-features = false }
coeus-hephaestus = { version = "0.10.0", path = "crates/coeus-hephaestus" }
coeus-autograd = { version = "0.10.0", path = "crates/coeus-autograd", default-features = false }
coeus-nn       = { version = "0.10.0", path = "crates/coeus-nn", default-features = false }
coeus-optim    = { version = "0.10.0", path = "crates/coeus-optim", default-features = false }
coeus-sparse   = { version = "0.10.0", path = "crates/coeus-sparse" }
coeus-dist     = { version = "0.10.0", path = "crates/coeus-dist", default-features = false }
coeus-fft      = { version = "0.10.0", path = "crates/coeus-fft" }

[profile.bench]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 1
# Backtraces resolve to file and line without the full DWARF that dominates
# both compile time and target size for a workspace this generic-heavy.
debug = "line-tables-only"

# Dependency debuginfo is the larger half again, and nothing here steps into a
# dependency. Re-enable per package, locally and uncommitted, to do so.
[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

# Inherits every debug setting above from `dev`.
[profile.test]
opt-level = 1

