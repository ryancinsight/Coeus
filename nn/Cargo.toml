[package]
name = "nn"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Neural network modules and layers for Coeus"
readme = "README.md"
keywords = ["machine-learning", "neural-networks", "deep-learning", "pytorch", "rust"]
categories = ["science", "algorithms"]

[lib]
doctest = false

[features]
default = ["std", "autograd", "attention", "normalization", "functional", "serde", "sysinfo"]
std = []
autograd = ["dep:autograd"]
quantized = ["dtype/quantized", "dtype/std"]
attention = []
normalization = []
clip = []
model_surgery = []
onnx = []
safetensors = []
distributed = []
dropout = []
embedding = []
functional = []
serde = ["dep:serde"]
sysinfo = ["dep:sysinfo"]
research = ["serde", "sysinfo"]
cpu = []
cuda = []

[dependencies]
# Workspace dependencies
dtype = { workspace = true, features = ["serde", "half"] }
storage = { workspace = true }
backend = { workspace = true }
tensor = { workspace = true }
autograd = { workspace = true, optional = true }
optim = { workspace = true }  # Re-enabled for complete async training support

# Async ecosystem
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = "0.3"

# External dependencies
num-traits = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }

# System information (optional for metadata)
sysinfo = { version = "0.32", optional = true }

# CPU information fallback
num_cpus = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
serde_bytes = "0.11"
async-trait = "0.1"
regex = "1.10"
rand = "0.8"
rand_distr = "0.4"
rand_pcg = "0.3"
half = { workspace = true }
rayon = "1.8"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.3"

# Observability and tracing
tracing = { workspace = true }


# Async streams
async-stream = "0.3"

# UUID generation for experiment tracking
uuid = { version = "1.0", features = ["v4"] }

# Rust version detection
rustc_version = "0.4"



[dev-dependencies]
proptest = { workspace = true }
approx = { workspace = true }
tempfile = "3.0"
criterion.workspace = true
flate2 = "1.0"
insta = "1.34"
arbitrary = { version = "1.3", features = ["derive"] }
fastrand = "2.0"

[[bench]]
name = "neural_networks"
path = "benches/neural_networks.rs"
harness = false
